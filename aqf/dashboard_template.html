<title>Воздух Ташкента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one forecast sheet read top-down — now → 24 h → week → season → how far to trust it. */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --ink: #15212c;
  --ink-2: #4b5967;
  --ink-3: #7a8794;
  --line: #dde4ea;
  --accent: #1f5f92;
  --band: rgba(31, 95, 146, 0.16);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --y1: #2a78d6; --y2: #eb6834; --y3: #1baf7a; --y4: #eda100; --y5: #e87ba4; --y6: #008300; --y7: #4a3aa7; --y8: #e34948;
  /* IQAir-style AQI category fills (semantic, same in both themes) */
  --aqi-1: #a8e05f; --aqi-2: #fdd64b; --aqi-3: #ff9b57;
  --aqi-4: #fe6a69; --aqi-5: #a97abc; --aqi-6: #a87383;
  --band-op: 0.16;
  --f-display: "Unbounded", "Golos Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-body: "Golos Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --surface: #141c23; --ink: #e6edf2; --ink-2: #a8b5c1; --ink-3: #74818d;
    --line: #24303a; --accent: #6cb0e4; --band: rgba(108, 176, 228, 0.18);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --band-op: 0.13;
    --y1: #3987e5; --y2: #d95926; --y3: #199e70; --y4: #c98500; --y5: #d55181; --y6: #008300; --y7: #9085e9; --y8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318; --surface: #141c23; --ink: #e6edf2; --ink-2: #a8b5c1; --ink-3: #74818d;
  --line: #24303a; --accent: #6cb0e4; --band: rgba(108, 176, 228, 0.18);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --band-op: 0.13;
  --y1: #3987e5; --y2: #d95926; --y3: #199e70; --y4: #c98500; --y5: #d55181; --y6: #008300; --y7: #9085e9; --y8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; display: grid; gap: 28px; }
h1, h2 { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(22px, 3.2vw, 30px); }
h2 { font-size: clamp(18px, 2.4vw, 22px); }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
section { display: grid; gap: 16px; min-width: 0; }
.sec-head { display: grid; gap: 6px; }

/* header */
header.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px 28px; }
header.top .where { display: grid; gap: 4px; min-width: 0; }

/* now + 24h */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.attr-row { display: grid; grid-template-columns: minmax(6em, max-content) minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; font-size: 13px; margin-bottom: 10px; }
.attr-row .cap { grid-column: 2 / 4; color: var(--ink-2); font-size: 12px; }
.attr-bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--line); }
.attr-bar i { display: block; height: 100%; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #15212c; width: fit-content; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgba(21, 33, 44, 0.55); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg rect[tabindex] { outline: none; }  /* focus shows the crosshair and tooltip instead */
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-3); }
.chart .lbl { fill: var(--ink-2); font-family: var(--f-body); font-size: 12px; font-weight: 500; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); min-width: 132px; z-index: 3; }
.tip .v { font-size: 18px; font-weight: 700; color: var(--ink); }
.tip .t { color: var(--ink-2); }
.tip .r { color: var(--ink-3); font-family: var(--f-mono); font-size: 11px; }
.tip .tip-key { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 18px; height: 2px; border-radius: 2px; display: inline-block; }
.key-band { width: 18px; height: 10px; border-radius: 3px; display: inline-block; background: var(--band); }

/* week chips */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { border-radius: 12px; padding: 10px 10px 9px; display: grid; gap: 2px; color: #15212c; min-width: 0; }
.day .dn { font-size: 12px; font-weight: 600; opacity: 0.8; }
.day .dv { font-size: 24px; font-weight: 700; line-height: 1.1; }
.day .dr { font-size: 11px; font-family: var(--f-mono); opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .dp { font-size: 11px; font-family: var(--f-mono); opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; justify-self: start; max-width: 100%; margin-top: 2px; }
.day .dp.hi { opacity: 1; font-weight: 700; color: #fff; background: rgba(21, 33, 44, 0.82); border-radius: 6px; padding: 1px 6px; }

/* season */
.months { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.month h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.month h3 .mean { font-family: var(--f-mono); color: var(--ink-2); font-weight: 500; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .wd { font-size: 10px; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.cal .c { aspect-ratio: 1; border-radius: 5px; font-size: 10px; display: grid; place-items: center; color: #15212c; font-family: var(--f-mono); max-width: 100%; }

.cal .c.past { background: transparent; color: var(--ink-3); opacity: 0.5; }
.cal .c.model { font-weight: 700; box-shadow: inset 0 0 0 1.5px rgba(21, 33, 44, 0.45); }
.cal .c.risk { color: var(--ink); }
.ychips { display: flex; flex-wrap: wrap; gap: 6px; }
.ychips button { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.ychips button .sw { width: 14px; height: 3px; border-radius: 2px; background: var(--line); }
.ychips button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); }
.ychips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; color: var(--ink-2); }
.pick select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chipc { display: inline-block; min-width: 38px; text-align: center; border-radius: 6px; padding: 1px 6px; color: #15212c; font-weight: 600; }
.mhist { font-size: 12px; color: var(--ink-3); margin: -4px 0 8px; }
.scale { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.scale span { display: inline-flex; align-items: center; gap: 6px; }
.scale i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* trust */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--surface); width: fit-content; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--ink-2); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.two { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: start; }
.tbl-wrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.best { color: var(--ink); font-weight: 600; }
/* scenario comparison: three short columns that fit a phone; the label column stays put if not */
table.cmp th, table.cmp td { padding: 7px 5px; white-space: normal; hyphens: auto; -webkit-hyphens: auto; }
table.cmp td:first-child { font-family: var(--f-body); font-size: 12px; position: sticky; left: 0; background: var(--surface); }
table.cmp tbody th { text-align: left; padding-top: 12px; }
td.gain { color: var(--s3); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; }
.notes h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.notes p, .notes li { font-size: 14px; color: var(--ink-2); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.deep h3 { margin: 0; font-size: 16px; font-weight: 600; }
.deep p, .deep li { font-size: 14px; color: var(--ink-2); margin: 0; }
.deep ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
a { color: var(--accent); }
footer { font-size: 12px; color: var(--ink-3); }

/* navigation: three sections by importance (forecast → history → research), each with its own tabs */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: -20px; padding-top: 8px; display: grid; gap: 4px; }
.sections, .tabs { display: flex; overflow-x: auto; scrollbar-width: none; }
.sections::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
.sections { gap: 4px; }
.sections button { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink-2); background: transparent; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.sections button:hover { background: var(--surface); color: var(--ink); }
.sections button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabs { gap: 2px; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-3); background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 10px 8px; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs[data-more="right"] { --fade: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.tabs[data-more="left"] { --fade: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
.tabs[data-more="both"] { --fade: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }
.tabs[data-more="right"], .tabs[data-more="left"], .tabs[data-more="both"] { mask-image: var(--fade); -webkit-mask-image: var(--fade); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.sections button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.panel { display: grid; gap: 20px; min-width: 0; }
[hidden] { display: none !important; }
.win { font-size: 15px; color: var(--ink); }
.acc-row { display: flex; flex-wrap: wrap; gap: 6px 32px; }
.acc { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.acc b { color: var(--ink); font-weight: 600; }
td.up { color: var(--s2); font-weight: 600; } td.down { color: var(--s1); font-weight: 600; }
.warn { font-size: 13px; color: var(--ink); border-left: 3px solid var(--s2); padding: 2px 0 2px 10px; }
.news { font-size: 13px; color: var(--ink); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
td.nv::after { content: '•'; color: var(--accent); margin-left: 3px; }
.ver { display: grid; gap: 8px; min-width: 0; }
.ver + .ver { border-top: 1px solid var(--line); padding-top: 14px; }
.ver h3 { margin: 0; font-size: 15px; font-weight: 600; }
.ver p { margin: 0; font-size: 14px; color: var(--ink-2); }
.ver th { hyphens: manual; -webkit-hyphens: manual; }
.ver td + td { white-space: nowrap; vertical-align: top; }
.ver .ci { color: var(--ink-3); font-size: 12px; font-weight: 400; }
.now-mini { display: flex; align-items: center; gap: 10px; }
.now-mini .chip { white-space: nowrap; }
.now-mini .v { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 900px) { .hours { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
@media (max-width: 520px) { .hours { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.hours .hc { border-radius: 8px; padding: 6px 2px 5px; text-align: center; color: #15212c; display: grid; gap: 1px; }
.hours .hc .ht { font-size: 11px; font-family: var(--f-mono); opacity: 0.75; }
.hours .hc .hv { font-size: 16px; font-weight: 700; }

@media (max-width: 760px) {
  .wrap { padding-inline: 16px; gap: 36px; }
  .two { grid-template-columns: 1fr; }
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .days { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .seg button, .sections button, .tabs button { transition: background 0.15s, color 0.15s, border-color 0.15s; }
}
/* language switch */
.eyebrow-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); border: 1.5px solid var(--ink-2); border-radius: 999px; padding: 1px 8px; }
.top-right { display: grid; gap: 8px; justify-items: end; align-content: start; padding-top: 2px; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--surface); }
.langs button { white-space: nowrap; font: inherit; font-size: 12px; font-weight: 600; border: 0; background: transparent; color: var(--ink-2); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.live-row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; white-space: nowrap; }
.refresh { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.refresh:disabled { opacity: 0.6; cursor: progress; }
.refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 760px) {
  header.top { grid-template-columns: 1fr; }
  .top-right { justify-items: start; grid-template-columns: 1fr; grid-template-areas: 'langs' 'mini' 'live'; gap: 10px; }
  .top-right .langs { grid-area: langs; } .top-right .now-mini { grid-area: mini; } .top-right .live-row { grid-area: live; justify-content: flex-start; white-space: normal; flex-wrap: wrap; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="where">
      <div class="eyebrow-row"><span class="badge" id="alpha-badge" data-t="alpha_badge"></span><span class="eyebrow" data-t="eyebrow"></span></div>
      <h1 data-t="title"></h1>
      <p class="small muted" id="stamp"></p>
      <p class="warn" id="fc-old" hidden></p>
    </div>
    <div class="top-right">
      <div class="langs" role="group" id="langs">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="uz">ЎЗ</button>
      </div>
      <div class="now-mini" id="now-mini">
        <span class="v" id="mini-num"></span>
        <span class="chip" id="mini-chip"></span>
      </div>
      <div class="live-row" id="live-row" hidden>
        <span class="small muted" id="live-stamp"></span>
        <button type="button" class="refresh" id="refresh"></button>
      </div>
    </div>
  </header>

  <nav class="navbar" id="navbar">
    <div class="sections" role="group" id="sections">
      <button type="button" data-sec="fc" aria-current="page" data-t="sec_fc"></button>
      <button type="button" data-sec="past" aria-current="false" data-t="sec_past"></button>
      <button type="button" data-sec="lab" aria-current="false" data-t="sec_lab"></button>
    </div>
    <div class="tabs" role="tablist" id="sub-fc">
      <button type="button" role="tab" id="tab-day" data-tab="day" aria-controls="p-day" aria-selected="true" data-t="tab_day"></button>
      <button type="button" role="tab" id="tab-week" data-tab="week" aria-controls="p-week" aria-selected="false" tabindex="-1" data-t="tab_week"></button>
      <button type="button" role="tab" id="tab-season" data-tab="season" aria-controls="p-season" aria-selected="false" tabindex="-1" data-t="tab_season"></button>
    </div>
    <div class="tabs" role="tablist" id="sub-past" hidden>
      <button type="button" role="tab" id="tab-history" data-tab="history" aria-controls="p-history" aria-selected="false" tabindex="-1" data-t="tab_history"></button>
      <button type="button" role="tab" id="tab-live" data-tab="live" aria-controls="p-live" aria-selected="false" tabindex="-1" data-t="tab_live"></button>
    </div>
    <div class="tabs" role="tablist" id="sub-lab" hidden>
      <button type="button" role="tab" id="tab-accuracy" data-tab="accuracy" aria-controls="p-accuracy" aria-selected="false" tabindex="-1" data-t="tab_accuracy"></button>
      <button type="button" role="tab" id="tab-compare" data-tab="compare" aria-controls="p-compare" aria-selected="false" tabindex="-1" data-t="tab_compare"></button>
      <button type="button" role="tab" id="tab-scenario" data-tab="scenario" aria-controls="p-scenario" aria-selected="false" tabindex="-1" data-t="tab_scenario"></button>
      <button type="button" role="tab" id="tab-sat" data-tab="sat" aria-controls="p-sat" aria-selected="false" tabindex="-1" data-t="tab_sat"></button>
      <button type="button" role="tab" id="tab-about" data-tab="about" aria-controls="p-about" aria-selected="false" tabindex="-1" data-t="tab_about"></button>
    </div>
  </nav>

  <section class="panel" role="tabpanel" id="p-day" aria-labelledby="tab-day">
    <div class="sec-head">
      <h2 data-t="day_h"></h2>
      <p class="win" id="day-window"></p>
      <div class="acc-row"><p class="acc" id="sum-day"></p><p class="acc" id="acc-day"></p></div>
      <p class="warn" id="drift-day" hidden></p>
    </div>
    <div class="card" style="display:grid; gap:10px; min-width:0">
      <div class="chart" id="c24"></div>
      <div class="legend">
        <span><i class="key-line" style="background:var(--ink-2)"></i><span data-t="measured"></span></span>
        <span><i class="key-line" style="background:var(--accent)"></i><span data-t="forecast"></span></span>
        <span><i class="key-band"></i><span data-t="range80"></span></span>
      </div>
    </div>
    <div class="card" style="display:grid; gap:10px">
      <span class="eyebrow" data-t="by_hour"></span>
      <div class="hours" id="hours"></div>
    </div>
  </section>

  <section class="panel" role="tabpanel" id="p-week" aria-labelledby="tab-week" hidden>
    <div class="sec-head">
      <h2 data-t="week_h"></h2>

  trust: (n, a, b, c, e) => `Проверка «вслепую» на 7 зимах (октябрь–март 2020–2026). В начале каждого месяца модель переобучалась на всех данных до этого дня — прошлые зимы и начало текущей, — затем выдавала прогноз каждые 3 часа, и прогноз сравнивался с тем, что произошло. Всего ${n} прогнозов. С 2024 года на вход шёл архивный прогноз погоды, как в реальной работе. Тест с заменой будущих данных на шум подтвердил: будущее в обучение не попадает. Зимой 2025/26 ошибка на сутки вперёд — ${a} AQI («как сейчас» — ${b}), на 6–7 суток — ${c} (климатология — ${e}).`,

  ver_eyebrow: 'Версии модели',
  ver_intro: 'Каждую неделю модель переобучается на свежих данных — её устройство при этом не меняется. Здесь — изменения самого устройства: что поменялось, с какого прогноза и что показала проверка. Изменение принимается, только если на прошлых зимах, не участвовавших в выборе, ошибка стала меньше.',

  acc_ver_gbm: (g, c, where) => `Цифры — для моделей LightGBM (версия от ${g}). С версии от ${c} прогноз на сайте начиная с 7-го часа — среднее LightGBM и нейросети; на прошлых зимах это снижает ошибку за неделю на 0,5–2,9 AQI (${where}).`,
  why_nn: 'Нейросеть', why_nn_note: ' «Нейросеть» — насколько смесь с нейросетью сдвигает прогноз LightGBM; группы входов разбирают прогноз LightGBM.', attr_col_nn: 'Нейросеть', attr_nn: 'Нейросеть — насколько смесь с нейросетью (с 4 ноября 2026) сдвинула прогноз LightGBM; остальные части разбирают прогноз LightGBM.',
  ver_what: {
    '2026-10-18': 'Первая версия в работе: отдельная модель LightGBM на каждую из 14 групп горизонтов; на входе — замеры PM2.5, среднее четырёх прогнозов погоды, инверсии, на 7–24 ч — прогноз CAMS.',
    '2026-10-28': 'Добавлены два входа из того же прогноза погоды: средняя западная составляющая ветра у земли за последние сутки и сильнейший порыв с запада (225–315°) за сутки. Повод — заметка IQAir о пыли, которую приносят западные ветры. Проверка показала обратное: западный поток в Ташкенте обычно приносит фронт и проветривание — в октябре–марте дни с порывами с запада сильнее 30 км/ч чище (AQI 88–93 против 125 при слабых порывах). Ошибка меньше на 1–2%, больше всего на 2–3 сутках; в октябре 2026 всего 27 дней, поэтому интервал там захватывает ноль.',
    '2026-11-04': 'Модели LightGBM прежние (версия от 28 октября). Начиная с 7-го часа прогноз — среднее их прогноза и прогноза нейросети (в логарифмах PM2.5), на первых 6 часах — только LightGBM. Нейросеть читает последние 72 часа замеров и погоды и даёт прогноз на неделю; каждое утро она заново обучается (три копии) на всех данных до момента прогноза. С 27 октября она работала в тени, рядом с основным прогнозом: за 14 прогнозов смесь ошиблась за неделю на 27,8 AQI против 30,1 у LightGBM, через 3 дня — на 22,0 против 28,1. Повод перейти — неделя 28 октября – 2 ноября, когда LightGBM занижал все дни, а нейросеть на 3 дня вперёд почти не занижала (−3 против −20). Если нейросеть утром не ответит, прогноз выйдет от одной LightGBM и будет помечен прежней версией.',
  },
  ver_issued: (first, last, n, cur) => cur ? `Прогнозы с ${first} (выпущено: ${n}).` : `Прогнозы с ${first} по ${last} (выпущено: ${n}).`,

  ver_bt_note: 'Средняя ошибка прогноза каждого часа на 1–7 дней вперёд, в пунктах AQI, при обычной проверке на прошлых зимах: модель учится только на данных до момента прогноза, погода — из архива прогнозов, как в работе. Минус — ошибка стала меньше.',

  ver_foot: date => `Прогноз на этой странице — от версии модели от ${date}.`,
  notes: [
    ['Данные', ['Цель — часовой US AQI по Ташкенту из архива tashkentairdata.uz (данные IQAir, с января 2025).', 'Для истории — станция посольства США в Юнусабаде (AirNow, ноябрь 2018 – февраль 2025), приведённая к шкале IQAir: на общем отрезке суточные значения совпадают с r = 0,89.', 'Суточный ход у посольства другой (пик утром, у городского среднего — в 21–22 ч), поэтому профиль внутри суток заменён на профиль IQAir.', 'Погода — Open-Meteo: архив ERA5 и архив прогнозов для обучения, прогнозы четырёх моделей на 16 дней для работы.']],
    ['Прогноз на сутки (1–24 ч)', ['7 отдельных моделей LightGBM: на 1, 2, 3, 4–6, 7–12, 13–18 и 19–24 часа вперёд. Каждая предсказывает, насколько изменится загрязнение относительно последнего часа.', 'Главное на этом горизонте — последние измерения и их тренд, обычный уровень для этого часа и даты, ветер и штиль, инверсия.', 'На 1–6 ч модели предсказывают медиану (устойчивее к редким скачкам). На 7–24 ч добавлен прогноз CAMS (физическая модель загрязнения Copernicus): он ловит застой и перенос воздуха.']],
    ['Прогноз на неделю (1–7 суток)', ['Ещё 7 моделей LightGBM: 25–36, 37–48, 49–72, 73–96, 97–120, 121–144 и 145–168 ч. Они крупнее (больше деревьев), потому что зависимости сложнее.', 'Влияние последних измерений к концу недели почти исчезает; решают прогноз ветра, инверсий, осадков и сезонная норма. Погода — среднее четырёх моделей (Open-Meteo, GFS, ICON, GEM); модели учились на архивных прогнозах, поэтому знают, как те ошибаются.', 'С 4 ноября 2026 начиная с 7-го часа прогноз — среднее LightGBM и нейросети (в логарифмах PM2.5). Нейросеть читает последние 72 часа замеров и погоды и каждое утро заново обучается на всех данных до момента прогноза; на прошлых зимах смесь ошибалась на 1–11% меньше LightGBM.']],
    ['Прогноз на 3 месяца (по дням)', ['Дни 1–7 — средние за сутки из часовых моделей.', 'С 8-го дня — норма для даты (средний AQI в эти даты за 2018–2026), к которой за ~4 дня плавно сходится уровень 7-го дня. Шанс красного дня — как часто эти даты были красными в прошлые годы.', 'Машинное обучение здесь проиграло норме: бустинг по дням, «прошлый год + тренд» и учёт отклонения за последние месяцы или год давали ошибку больше.']],
    ['Как модели связаны', ['Каждая из 14 часовых моделей обучается отдельно на своём горизонте, изменение одной не трогает другие.', 'Трёхмесячная модель — отдельная; её переобучение не влияет на прогноз на сутки и неделю. Связь только одна и в одну сторону: первые 7 дней трёхмесячного прогноза берутся из часовых моделей.', 'Модели переобучаются раз в неделю на всех данных, включая текущую зиму.']],
    ['Ограничения', ['Это прогноз для города в целом (среднее по датчикам IQAir), а не для конкретного двора.', 'Дальше 7–10 дней никто не знает погоду, поэтому за горизонтом недели прогноз показывает типичный уровень и шанс красного дня, а не конкретные грязные дни.', 'Резкие эпизоды (пыльные бури, пожары, внезапные инверсии) модель видит только через погоду и может их запаздывать.']],
    ['Почему не Яндекс Погода или Gismeteo', 'Модели нужна многолетняя почасовая история погоды и архив прогнозов, чтобы честно проверить её. У Яндекса и Gismeteo архива нет, а API платные. Open-Meteo отдаёт и то и другое бесплатно, и в нём есть четыре глобальные модели, среднее которых точнее любой одной.'],
  ],
  foot: 'Данные: tashkentairdata.uz (архив IQAir), станция посольства США (AirNow, 2018–2025), погода Open-Meteo, CAMS. Модели: LightGBM по горизонтам, переобучение раз в неделю; с 7-го часа — среднее с нейросетью, она переобучается каждое утро.',

  deep_h: "How the model decides",
  shap_h: "Breaking the forecast down with SHAP",
  shap_p: ["Every hourly forecast is the answer of a LightGBM gradient-boosting model to about 75 inputs. SHAP (Shapley values from cooperative game theory) splits that answer exactly: how much each input added or took away compared with the model’s average forecast. It is not an approximation — the contributions add up to the forecast exactly.", "The model forecasts how pollution will change from its level at the forecast time (in log PM2.5). For each hour the groups’ contributions are added to that level one after another, after each step the level is turned into AQI, and the steps are averaged over the day’s 24 hours. That is why in the “What the forecast is made of” table on the Week tab, “Now” plus the contributions equals the day’s forecast. The order of the groups slightly changes how the credit is shared between them (the AQI scale is not linear), but not the total.", "This explains the model, not the physics. Inputs that move together share the credit somewhat arbitrarily: cold often comes with calm air, so part of one’s effect can go to the other. The model does not see emissions directly — temperature (heating), the seasonal norm and recent pollution stand in for them."],

  shap_example: (d, now, r, s, t, g, w, o, f) => `An example from the current forecast, ${d}: now ${now}; recent pollution ${r}, seasonal norm ${s}, temperature ${t}, stagnant air ${g}, rain and humidity ${w}, other ${o} — forecast ${f}.`,
  stag_h: "Stagnant air or pollution level: past winters",

  month: 'Month', reds_y: y => `Red days ${y}`, with_fc: y => `${y} incl. forecast`, of: (a, n) => `${a} of ${n}`, reds_short: r => `≈${r} red`,
  acc_h: 'How far to trust it', live_since: d => `In real use since ${d}:`, live_24: '24 h', live_7: 'week', live_n: 'forecasts:',
  live_wait: 'Real-use check: every daily forecast is saved and compared with what happened. First numbers appear after a day.',
  drift: (m, k, n) => `Over the last ${n} days the next-day forecast ran ${m > 0 ? 'high' : 'low'} by ${Math.abs(Math.round(m))} AQI on average (${k} of ${n} days). Keep this in mind: the model does not correct such a bias itself.`,
  why_eyebrow: 'What the forecast is made of', why_note: (now, t) => `Starting point: the AQI at the forecast time (${t}): ${now}. Then how many AQI points each group of inputs moves the day’s mean AQI; together they give the forecast. “+” makes the air dirtier, “−” cleaner.`,
  why_cols: ['Day', 'Now', 'Recent pollution', 'Seasonal norm', 'Temperature', 'Stagnant air', 'Rain and humidity', 'Other', 'Forecast'],
  why_caveat: 'This is a SHAP breakdown of the model, not of the physics: inputs that move together share the credit somewhat arbitrarily. Recent pollution — levels and trends over the last days; seasonal norm — what is typical for these dates and hours and how far the air now is from it; temperature — air temperature and its change, both weather and heating demand; stagnant air — wind near the ground and aloft, calm, inversions, pressure; rain and humidity — rain, snow, humidity, cloud, sunshine; other — time of day, day of week, the CAMS forecast. The model does not see emissions directly: how much more or less pollution there was than expected is shown by the error breakdown under History → Forecast vs actual.',
  live_eyebrow: 'Forecast vs actual by day — in real use',
  live_empty: 'Every morning the forecast is saved and later compared with what happened. The first comparison appears tomorrow, the weekly one in 7 days. Past forecasts are not reconstructed: the model has already seen those days, so such a check would not be fair.',
  live_note: parts => `Daily mean AQI: what was forecast in advance and what happened. Average error — ${parts}.`,
  lead1: '1 day ahead', lead3: '3 days ahead', lead7: '7 days ahead', lead_part: (nm, v, n) => `${nm}: ±${v} AQI (${n} d)`,
  actual: 'actual', fc_lead: nm => `forecast ${nm}`, live_aria: 'Forecast and actual by day',
  live_cols: ['Day', 'Actual', 'Forecast 1 day ahead', 'error', '3 days ahead', 'error', '7 days ahead', 'error'],
  attr_eyebrow: 'Why the forecast missed',
  attr_parts: ['weather', 'pollution above/below expected', 'unknown'],
  attr_note: 'We split the error of the forecast the site showed (the morning one, 1 or 3 days ahead) and re-run it with the same model twice more. Weather — how much the forecast would change if the model had known the actual weather instead of the weather forecast. Pollution — the comparison with a reference run from midnight of that day, also with actual weather: by midnight the model already knows how much pollution really built up, so the difference shows how much dirtier or cleaner the air got than expected with the right weather (emissions, heating, transport). Unknown — the reference run’s own error: what even it missed. The 7-day forecast is not split: that far it is climatology, the weather does not enter it.',
  attr_bt: (n, a, b) => `Past winters (${n} days, ${a} – ${b}), average size of each part:`, attr_total: 'whole error',
  attr_live_note: 'In real use, by day; the parts add up to the whole error. “+” means this part pushed the forecast above the actual, “−” below. Pollution “+” means the air was cleaner than the model expected. “Weather” is how far the forecast would move with the right weather, not how much the error would shrink: the move can also be away from the actual. On average the right weather reduces the error by about 8% 1 day ahead and by 12% 3 days ahead (tested on 2024–2026).',
  attr_live_empty: 'The day-by-day breakdown appears once the first forecast day is over.',
  sh_eyebrow: 'The neural network and the blend',
  sh_note: 'Every morning, next to LightGBM, a neural network is trained (three copies, on all data up to the forecast time) and makes its own week forecast from the same weather inputs. “Blend” is the average of it and LightGBM from hour 7 on; for the first 6 hours it is LightGBM. Since 4 November 2026 the blend is the site’s forecast; before that the network ran in the shadow. The table shows the average error in AQI on the same hours and days; lower is better.',
  sh_n: (n, b) => `Forecasts: ${n}` + (b ? (b === n ? ', all' : `, ${b} of them`) + ` computed afterwards from the saved inputs (the network trained only on data before the forecast time)` : '') + '.',
  sh_empty: 'The first comparison appears a day after the first shadow forecast.',
  sh_cols: ['Compared', 'LightGBM', 'Network', 'Blend', 'Count'],
  sh_rows: { day: 'Each hour, first 24 h', week: 'Each hour, whole week', lead1: 'Daily mean, tomorrow', lead3: 'Daily mean, 3 days ahead' },
  sh_unit: { day: 'h', week: 'h', lead1: 'd', lead3: 'd' },
  sh_bt: r => `For reference, the check on past winters (whole week, each hour): ${r}.`,
  sh_season: y => y === 2026 ? 'October 2026' : `winter ${y}/${String(y + 1).slice(2)}`, sh_arrow: 'blend',
  sh_later: 'The comparison goes on: if in real use the blend turns out worse than LightGBM, it will show here.',
  si_eyebrow: 'Comparison with SILAM',
  si_note: 'SILAM is the atmospheric composition model of the Finnish Meteorological Institute (FMI); Uzbekistan’s National Committee on Ecology uses it too. Every day we save its forecast for Tashkent and compare it with ours and with what happened, on the same hours and days. We compare forecasts issued on the same day: SILAM starts from 05:00 Tashkent time (out at about 10:00), ours from 06:00 (out at 07:14). SILAM computes pollution from emissions and weather, without city measurements, and is compared as is, uncorrected. The table shows the average error in AQI; lower is better.',
  si_n: (n, runs) => `Our forecasts compared: ${n}; SILAM forecasts saved: ${runs}.`,
  si_empty: 'The comparison appears once the first day covered by both our forecast and SILAM’s is over.',
  si_cols: ['Compared', 'Our forecast', 'SILAM', 'SILAM corrected', 'Count'],
  si_rows: { h1_24: 'Each hour, first 24 h', h25_72: 'Each hour, days 2–3', lead1: 'Daily mean, tomorrow', lead2: 'Daily mean, 2 days ahead', lead3: 'Daily mean, 3 days ahead' },
  si_unit: { h1_24: 'h', h25_72: 'h', lead1: 'd', lead2: 'd', lead3: 'd' },
si_alone: (a, b, n, m, bias, r, cm, cb) => `All saved SILAM forecasts for the next day (${a} – ${b}, ${n} d): as is, error ±${m} AQI, on average ${Math.abs(bias)} ${bias < 0 ? 'below' : 'above'} the actual value` + (r == null ? '' : `; ups and downs match the actual with r = ${r}`) + `; corrected, ±${cm}, on average ${Math.abs(cb)} ${cb < 0 ? 'below' : 'above'}.`,
  si_credit: 'SILAM forecasts: Finnish Meteorological Institute, licence CC BY 4.0.',
  si_ours: 'our forecast', si_silam: 'SILAM forecast', si_issued: (nm, d) => `${nm}, issued ${d}`, si_today: 'today',
  si_aria: 'SILAM forecasts, our forecasts and actual values by day',
  si_days_note: 'Daily mean AQI. For past days, the forecasts for that day issued the day before, both on the same day. After the “today” line, the latest forecasts of both models several days ahead. Actual values only for complete days.',
  si_corr: 'SILAM corrected',
  si_corr_note: 'SILAM corrected is the same SILAM forecast multiplied by the ratio of measured to SILAM values over the 7 days up to 06:00 of its issue day, so it uses only what had been measured when our forecast came out. SILAM itself does not see measurements and runs 2–2.4 times below Tashkent’s levels; the correction gives it the current level, while the ups and downs remain its own. Tracked this way since 27 October 2026; earlier days were recomputed the same way from the saved forecasts.',
  tab_scenario: 'Scenario', sc_h: 'If emissions were cut',
  sc_intro: 'Not a forecast but a what-if: how much cleaner the air would be if the contributions of sources fell. Both scenarios cut the same sources — heating of homes and offices, dust blown in from outside the city, transport and heavy industry — the moderate one less, the strong one more. The monthly shares of the sources come from the World Bank’s assessment. The forecast on the other tabs does not include these scenarios.',
  sc_names: { moderate: 'Moderate', strong: 'Strong' }, sc_base: 'No cuts',
  sc_cmp_eyebrow: 'The two scenarios side by side',
  sc_cmp_groups: ['Cut in the contribution', 'What it gives'],
  sc_cmp_rows: { heating: 'Heating', dust: 'Dust from outside', transport: 'Transport', heavy: 'Heavy industry', pm: 'Winter PM2.5', aqi: 'Mean winter AQI', red: 'Days with AQI > 150, all winters', next: 'Next days: mean AQI' },
  sc_cmp_note: (n, a, b, d, x, y) => `Winters: November–February, ${a}–${b}, as measured (${n} winters, ${d} days), recomputed under each scenario. Next days: ${x}–${y}, the mean daily AQI as forecast and under each scenario.`,
  sc_pick: 'Details:', sc_pick_aria: 'Scenario for the detailed tables',
  sc_src: ['Source of the shares: World Bank, ', 'Air Quality Assessment for Tashkent', ' (June 2024), Figure 18 on p. 15 — a dispersion-model estimate for 2021.'],
  sc_days_eyebrow: n => `Next days: forecast → ${n} scenario`,
  sc_days_cols: ['Day', 'Daily AQI', 'Change', 'PM2.5, µg/m³', 'Change'],
  sc_why: (m0, h0, c0, m1, h1, c1, hr, cr) => `Why AQI changes less than PM2.5. The AQI scale is not proportional to concentration: between 100 and 150 one µg/m³ is 2.5 AQI points, above 150 only 0.7. So the same cut in PM2.5 gives fewer AQI points in dirty hours. The cut itself depends on the season: in mid-${m0} heating makes ${h0}% of the pollution (PM2.5 −${c0}%), in mid-${m1} ${h1}% (−${c1}%). Between mid-months the share changes smoothly, day by day, so on these days heating makes ${hr}% and PM2.5 falls by ${cr}%.`,
  sc_months_eyebrow: n => `By month: ${n} scenario`,
  sc_months_note: (a, b) => `Source shares, % (as in the report’s figure; they are monthly means, which we place on the 15th), and how much the scenario cuts PM2.5 in mid-month. Mean AQI and unhealthy days (AQI above 150) per 30 days: measurements of ${a}–${b}, recomputed under the scenario with the smooth shares.`,
  sc_month_cols: ['Month', 'Heating', 'Dust from outside', 'Transport', 'Heavy industry', 'PM2.5 cut', 'Mean AQI', 'Unhealthy days a month'],
  sc_winters_eyebrow: n => `Past winters: ${n} scenario`,
  sc_winters_note: 'The same scenario on the measured winters (November–February): mean AQI and how many days would have had AQI above 150 (unhealthy) and above 100.',
  sc_winter_cols: ['Winter', 'Days', 'Mean AQI', 'Days AQI > 150', 'Days AQI > 100'], sc_total: 'All winters',
  sc_caveats_h: 'Assumptions',
  sc_caveats: [
    'The source shares are the World Bank model’s result for 2021, monthly means. We place them on the 15th of each month and change them smoothly, day by day, in between: heating is switched on gradually, and with month steps its share would jump from 15% to 38% on 1 November. Within a day the mix is taken as constant; on the dirtiest days heating’s share is probably higher, so the gain on those days is probably understated here.',
    'A source’s contribution falls in proportion to its emissions. This holds for particles emitted directly, and roughly for particles formed in the air from gases.',
    'In October and December the shares in the report’s figure add up to 102% and 104% (rounding); we scale them to 100%.',
    'The recalculation is hour by hour: PM2.5 is multiplied by its day’s factor and converted to AQI; a daily value is the mean of hourly AQI, as everywhere on the site.',
  ],
  sc_empty: 'The scenario is not available right now.',
  tab_sat: 'Satellites', sat_h: 'Satellites: gas from burning, and fires',
  sat_intro: 'These are not forecast inputs but observations we save every day and compare with the actual air. Once a day, at about 13:00, the Sentinel-5P satellite measures nitrogen dioxide (NO₂) over Tashkent — the gas from heating, cars and power plants; it cannot see through clouds. VIIRS images (NASA FIRMS) mark fires — burning fields and rubbish — within 200 km; permanent industrial heat sources such as the Almalyk works are counted apart.',
  sat_chart_eyebrow: 'Last 120 days',
  sat_panel: ['Daily AQI (actual)', 'NO₂ over the city, µmol/m²', 'Fires within 200 km per day'],
  sat_legend: ['actual AQI', 'NO₂ over the city', 'fires within 200 km'],
  sat_aria: 'AQI, NO₂ over the city and fires by day',
  sat_chart_note: (n, y) => `NO₂ is the mean gas column over the city (within 15 km); gaps are days when clouds hid the city. The satellite’s final data arrive about 9 days later; until then the quick data are shown. Days with NO₂ over the city since ${y}: ${n}.`,
  sat_tip: { aqi: 'daily AQI', no2: 'NO₂, µmol/m²', fires: 'fires within 200 km', none: 'no data' },
  sat_corr_eyebrow: 'Relation to the actual air',
  sat_corr_note: 'Rank correlation (Spearman): 1 — rise and fall together, 0 — no relation, below zero — the opposite. Number of days in brackets; a dash means fewer than 20 days with data. NO₂ since 2018, fires from NASA’s yearly archives and daily data.',
  sat_model_note: 'Would yesterday’s NO₂ improve the forecast as a model input? Tested on past winters by the usual rules (chosen on winter 2024/25, confirmed on 2025/26 and October 2026): slightly worse on the choice winter, 0.1–0.3 AQI better on the others against an average error of about 30 (under 1%). Not added: the model already sees the current pollution level in the measurements.',
  sat_fire_gap: (a, b, c) => `Fires: NASA has not yet published its archive for ${a} – ${b}; daily data since ${c}.`,
  sat_corr_cols: ['What with what', 'All days', 'Winter (Nov–Feb)', 'September–October', 'Last 90 days'],
  sat_corr_rows: { no2_aqi: 'NO₂ over the city and daily AQI', no2_aqi13: 'NO₂ over the city and AQI at 13–14 h', no2_ring_aqi: 'NO₂ 30–50 km out and daily AQI', fires_aqi: 'Fires within 200 km and daily AQI', fires_next: 'Fires within 200 km and next day’s AQI' },
  sat_years_eyebrow: 'The last 30 days and the same days of past years',
  sat_years_cols: ['Year', 'NO₂ over the city', 'Days with NO₂', 'Fires within 200 km', 'Mean AQI'],
  sat_years_note: d => `30 days up to ${d} of each year; NO₂ is the mean over the days the city was seen.`,
  sat_credit: 'Sentinel-5P: contains modified Copernicus Sentinel data (2018–2026), MEEO copy on AWS Open Data. Fires: NASA FIRMS, VIIRS Suomi NPP.',
  sat_empty: 'Satellite data are not loaded yet.',
  attr_rerun: 'Re-run — the gap between the issued forecast and its re-run: the weather was rebuilt from archived weather forecasts (≈) or an earlier model version issued the forecast (*). About zero for new forecasts.', attr_col_rerun: 'Re-run',
  attr_cancel: 'The parts often partly cancel out, so their average sizes add up to more than the average error.',
  attr_cols: ['Day', 'Forecast', 'Actual', 'Error', 'Weather', 'Pollution', 'Unknown'],
  past_eyebrow: 'Check on past winters',
  trust: (n, a, b, c, e) => `Blind test on 7 winters (October–March, 2020–2026). At the start of every month the model was retrained on all data up to that day — past winters and the start of the current one — then issued a forecast every 3 hours, and each forecast was compared with what happened. ${n} forecasts in total. From 2024 the inputs were archived weather forecasts, as in real use. A test that replaces future data with noise confirmed that the future does not leak into training. In winter 2025/26 the error one day ahead was ${a} AQI ("same as now": ${b}), 6–7 days ahead ${c} (climatology: ${e}).`,
  scope_iq: 'Winter 2025/26 + Oct 2026', scope_all: 'All winters 2020–2026', scope_aria: 'Test period',
  mae_eyebrow: 'Average error, AQI — lower is better', s_model: 'model', s_persist: '"same as now"', s_clim: 'climatology',
  axis_h: 'forecast horizon, hours', mae_aria: 'Average forecast error by horizon',
  mae_cols: ['Horizon, h', 'Model', '"Same as now"', 'Climate', 'Gain', 'Category right'],
  daily_cap: 'Daily forecast (all winters 2020–2026)', daily_cols: ['Horizon, days', 'Forecast', '7-day mean', 'Climate', 'Gain'],
  seas_cap: 'By season: average error 1–24 h ahead and 3–7 days ahead',
  seas_cols: ['Season', 'Data', 'Forecasts', '1–24 h: model', '"same as now"', '3–7 d: model', 'climate'],

  about_h: 'How it works',
  dmy: (d, M) => `${d.getDate()} ${M.mon_gen[d.getMonth()]} ${d.getFullYear()}`,
  ver_news: (date, what, d, t) => `The model was updated on ${date}: ${what}. ` + (d ? `Forecasts from ${d}, ${t} on come from the new version.` : 'The new version issues its first forecast with the next morning update; the forecast shown now is from the previous one.'),
  ver_more: 'What changed',
  ver_eyebrow: 'Model versions',
  ver_intro: 'Every week the model is retrained on fresh data — that does not change how it is built. This lists changes to the model itself: what changed, from which forecast on, and what the check showed. A change is accepted only if it lowers the error on past winters that played no part in choosing it.',
  ver_title: (date, cur) => date + (cur ? ' · in use now' : ''),
  ver_short: { '2026-10-28': 'it now takes into account how the westerly wind blew over the last day', '2026-11-04': 'from hour 7 on the forecast is the average of LightGBM and a neural network' },
  acc_ver_gbm: (g, c, where) => `Numbers are for the LightGBM models (version of ${g}). Since the version of ${c}, from hour 7 on the site’s forecast is the average of LightGBM and a neural network; on past winters that lowers the week’s error by 0.5–2.9 AQI (${where}).`,
  why_nn: 'Neural network', why_nn_note: ' “Neural network” is how much the blend with the network moves LightGBM’s forecast; the input groups break down LightGBM’s forecast.', attr_col_nn: 'Network', attr_nn: 'Network — how much the blend with the neural network (since 4 November 2026) moved LightGBM’s forecast; the other parts break down LightGBM’s.',
  ver_what: {
    '2026-10-18': 'First version in use: a separate LightGBM model for each of 14 horizon groups; inputs are PM2.5 measurements, the mean of four weather forecasts, inversions, and for 7–24 h the CAMS forecast.',
    '2026-10-28': 'Two inputs added, from the same weather forecast: the mean westerly wind component near the ground over the last day, and the strongest gust from the west (225–315°) over the last day. The prompt was an IQAir note on dust brought by westerly winds. The check showed the opposite: in Tashkent westerly flow usually brings a front and ventilation — from October to March, days with westerly gusts above 30 km/h are cleaner (AQI 88–93 vs 125 with weak gusts). The error is 1–2% lower, most of all on days 2–3; October 2026 has only 27 days, so its interval includes zero.',
    '2026-11-04': 'The LightGBM models are unchanged (version of 28 October). From hour 7 on the forecast is the average of their forecast and a neural network’s (in log PM2.5); for the first 6 hours it is LightGBM alone. The network reads the last 72 hours of measurements and weather and forecasts the week; every morning it is retrained (three copies) on all data up to the forecast time. Since 27 October it ran in the shadow next to the main forecast: over 14 forecasts the blend was off by 27.8 AQI over the week against 30.1 for LightGBM, and by 22.0 against 28.1 three days ahead. The occasion was the week of 28 October – 2 November, when LightGBM was too low every day while the network, three days ahead, was hardly low at all (−3 against −20). If the network does not answer in the morning, the forecast goes out from LightGBM alone and is marked with the previous version.',
  },
  ver_issued: (first, last, n, cur) => cur ? `Forecasts since ${first} (issued: ${n}).` : `Forecasts from ${first} to ${last} (issued: ${n}).`,
  ver_none: 'No forecasts issued yet: the first comes with the next morning update.',
  ver_bt_cols: ['Check', 'Error of the previous version', 'Change (95% interval)'],
  ver_period: { '2024/25': 'Winter 2024/25 — used for the choice', '2025/26': 'Winter 2025/26 — check', '2026-10': 'October 2026 — check' },
  ver_bt_note: 'Mean error of the hourly forecast 1–7 days ahead, in AQI points, under the usual check on past winters: the model learns only from data before each forecast, and the weather comes from archived forecasts, as in real use. Minus means a smaller error.',
  live_ver_wait: date => `The model was updated on ${date}; all forecasts here are still from the previous version. The new one issues its first forecast with the next morning update.`,
  live_ver_on: (date, first, scored) => `Since ${first} forecasts come from the new model version (of ${date}). ` + (scored ? 'In the table its forecasts are marked with a dot •; the dashed line on the chart is the first day with its 1-day-ahead forecast.' : 'The comparison with the actual appears once the first day it forecast is over.'),
  live_newver: 'new version, 24 h',
  nv_title: 'forecast by the new model version',
  ver_mark: 'new version',
  acc_ver: (date, cur) => cur ? `Numbers are for the current model version (of ${date}).` : `Numbers are for the previous model version (of ${date}); they are recomputed for the new one at the monthly update.`,
  ver_foot: date => `The forecast on this page is from the model version of ${date}.`,
  notes: [
    ['Data', ['Target: hourly US AQI for Tashkent from the tashkentairdata.uz archive (IQAir data, since January 2025).', 'Longer history: the US Embassy station in Yunusabad (AirNow, November 2018 – February 2025), adjusted to the IQAir scale; where both exist, daily values agree with r = 0.89.', 'The embassy has a different daily rhythm (morning peak; the city average peaks at 21–22 h), so its within-day profile was replaced with the IQAir one.', 'Weather: Open-Meteo — ERA5 and archived forecasts for training, four models\' 16-day forecasts in operation.']],
    ['24-hour forecast (1–24 h)', ['7 separate LightGBM models for 1, 2, 3, 4–6, 7–12, 13–18 and 19–24 hours ahead. Each predicts how much pollution will change from the latest hour.', 'What matters most here: the latest readings and their trend, the usual level for this hour and date, wind and calm, inversions.', 'For 1–6 h the models predict the median (more robust to rare spikes). For 7–24 h the CAMS forecast (Copernicus\' physical pollution model) is added: it catches stagnation and air transport.']],
    ['Week forecast (1–7 days)', ['7 more LightGBM models: 25–36, 37–48, 49–72, 73–96, 97–120, 121–144 and 145–168 h. They are larger (more trees) because the relationships are more complex.', 'By the end of the week the latest readings barely matter; the wind, inversion and precipitation forecasts and the seasonal norm decide. Weather is the mean of four models (Open-Meteo, GFS, ICON, GEM); the models learned on archived forecasts, so they know how those forecasts err.', 'Since 4 November 2026, from hour 7 on the forecast is the average of LightGBM and a neural network (in log PM2.5). The network reads the last 72 hours of measurements and weather and is retrained every morning on all data up to the forecast time; on past winters the blend erred 1–11% less than LightGBM.']],
    ['3-month forecast (by day)', ['Days 1–7: daily means of the hourly models.', 'From day 8: the norm for the date (mean AQI on these dates in 2018–2026), which the day-7 level smoothly approaches within ~4 days. Chance of a red day: how often these dates were red in past years.', 'Machine learning lost to the norm here: a daily boosting model, "last year + trend" and using the last months\' or year\'s deviation all gave larger errors.']],
    ['How the models relate', ['Each of the 14 hourly models is trained separately for its own horizon; changing one does not touch the others.', 'The 3-month model is separate; retraining it does not affect the 24-hour or week forecasts. There is only one link, in one direction: the first 7 days of the 3-month forecast come from the hourly models.', 'The models are retrained weekly on all data, including the current winter.']],
    ['Limitations', ['This is a forecast for the city as a whole (the mean over IQAir sensors), not for a specific courtyard.', 'Nobody knows the weather beyond 7–10 days, so past one week the forecast shows the typical level and the chance of a red day, not specific bad days.', 'Sudden episodes (dust storms, fires, abrupt inversions) are seen by the model only through the weather and may come late.']],
    ['Why not Yandex Weather or Gismeteo', 'The model needs years of hourly weather history and an archive of forecasts to be tested fairly. Yandex and Gismeteo have no archive and their APIs are paid. Open-Meteo provides both for free and offers four global models whose mean is more accurate than any single one.'],
  ],
  foot: 'Data: tashkentairdata.uz (IQAir archive), US Embassy station (AirNow, 2018–2025), Open-Meteo weather, CAMS. Models: LightGBM per horizon, retrained weekly; from hour 7 averaged with a neural network retrained every morning.',
  code_link: 'Project code on GitHub',
},

  shap_p: ["每个逐小时预报都是LightGBM梯度提升模型对约75个输入的回答。SHAP方法（来自合作博弈论的沙普利值）将这个回答精确分解：每个输入相对于模型的平均预报增加或减少了多少。这不是近似——各项贡献之和恰好等于预报。", "模型预测污染相对于预报时刻水平的变化（以PM2.5的对数计）。对每个小时，各组贡献依次加到该水平上，每一步后将水平换算为AQI，再对当天24小时的步长取平均。因此在“周”页“预报由什么构成”表中，“现在”加上各项贡献等于当天的预报。各组的顺序会略微影响贡献在组间的分配（AQI刻度是非线性的），但不影响总数。", "这是对模型的分解，而非物理过程。相互关联的输入分享贡献的方式在一定程度上是任意的：寒冷常伴随静风，因此其中一个的部分影响可能归入另一个。模型无法直接看到排放——由气温（供暖）、季节常态和近期污染代表。"],

  stamp: (t, d, gd, gt) => `Маълумотлар ${d}, ${t} гача · прогноз ${gd} куни ${gt} да янгиланди`,
  fc_old: (d, t) => `Прогноз ${d}, ${t} дан бери янгиланмади: эрталабки ҳисоб ўтмади. Охирги муваффақиятли прогноз кўрсатилмоқда.`,
  deep_h: "Модел қандай қарор қабул қилади",
  shap_h: "Прогнозни SHAP усули билан таҳлил қилиш",
  shap_p: ["Ҳар бир соатлик прогноз — LightGBM градиент бустинг моделининг тахминан 75 та кириш маълумотига жавоби. SHAP усули (кооператив ўйинлар назариясидаги Шепли қийматлари) бу жавобни аниқ ажратади: ҳар бир кириш моделнинг ўртача прогнозига нисбатан қанча қўшди ёки айирди. Бу тахминий эмас — ҳиссалар йиғиндиси прогнозга айнан тенг.", "Модел прогноз пайтидаги даражага нисбатан ифлосланиш қанчалик ўзгаришини прогноз қилади (PM2.5 логарифмларида). Ҳар бир соат учун гуруҳлар ҳиссаси навбат билан шу даражага қўшилади, ҳар қадамдан кейин даража AQI га ўтказилади ва қадамлар куннинг 24 соати бўйича ўртачаланади. Шунинг учун «Ҳафта» бўлимидаги «Прогноз нимадан таркиб топган» жадвалида «Ҳозир» плюс ҳиссалар куннинг прогнозига тенг. Гуруҳлар тартиби ҳиссанинг улар орасида бўлинишига бироз таъсир қилади (AQI шкаласи чизиқли эмас), лекин якунга эмас.", "Бу физиканинг эмас, моделнинг таҳлили. Бир-бири билан боғлиқ кириш маълумотлари ҳиссани шартли бўлишади: совуқ кўпинча шамолсиз бўлади, шунинг учун бирининг таъсирининг бир қисми бошқасига ўтиши мумкин. Модел чиқиндиларни бевосита кўрмайди — уларни ҳарорат (иситиш), мавсумий меъёр ва яқиндаги ифлосланиш билдиради."],
  shap_groups_h: "Кириш маълумотлари гуруҳлари:",
  shap_groups: ["Яқиндаги ифлосланиш — охирги соатлар ва кунлардаги даражалар, ўртачалар ва тенденциялар, ўтган кунлардаги шу соат.", "Мавсумий меъёр — бу саналар ва соатларда одатда нима бўлади (2018–2026) ва ҳозирги ҳаво ундан қанчалик фарқ қилади.", "Ҳарорат — ҳаво ҳарорати, кунлик ўртачаси, ўзгариши, «иситиш градус-кунлари»: бу ҳам об-ҳаво, ҳам иситишга талабнинг ягона белгиси.", "Ҳаво турғунлиги — ер юзаси ва тахминан 1,5 км баландликдаги шамол, шамолсиз соатлар, инверсиялар (юқоридаги ҳаво ердагидан қанчалик илиқ), босим, ҳароратнинг кунлик фарқи.", "Ёғин ва намлик — ёмғир, қор, намлик, булутлилик, қуёш.", "Бошқа — кун вақти, ҳафта куни, CAMS прогнози ва моделнинг ўртача силжиши."],
  shap_example: (d, now, r, s, t, g, w, o, f) => `Жорий прогноздан мисол, ${d}: ҳозир ${now}; яқиндаги ифлосланиш ${r}, мавсумий меъёр ${s}, ҳарорат ${t}, ҳаво турғунлиги ${g}, ёғин ва намлик ${w}, бошқа ${o} — прогноз ${f}.`,
  stag_h: "Ҳаво турғунлиги ёки ифлосланиш даражаси: ўтган қишлар таҳлили",
  stag_p: ["Прогноз хато қилганда икки изоҳ бор. Модел турғунликни ортиқча баҳолаши мумкин — шамолсизлик ва инверсияда ҳаво аслидагидан кўпроқ ифлосланади деб ҳисоблаши. Ёки ифлосланиш даражасининг ўзи бошқача бўлган — чиқиндилар, кўчиб келиш. Бир кун бўйича уларни ажратиб бўлмайди: иккала хато ҳам «ҳаво кутилганидан тозароқ (ёки ифлосроқ)» бўлиб кўринади.", "Кўп кунлар бўйича — мумкин. Агар модел турғунликни ортиқча баҳоласа, хато турғунлик ҳиссаси билан бирга ўсади: турғун кунларда прогноз кўпроқ, шамолли кунларда камроқ ошади. Агар даража силжиган бўлса, хато турғунликка боғлиқ эмас."],
  stag_method: (n, a, b) => `${a} дан ${b} гача бўлган қишларнинг ҳар бир куни учун (${n} кун) эртанги прогноз 06:00 дан ҳақиқий об-ҳаво билан — об-ҳаво прогнози хатолари чиқариб ташланган — фақат ўша қишдан олдинги маълумотларда ўқитилган модел билан қайта ҳисобланди. Ҳар куннинг хатоси (прогноз минус ҳақиқат) SHAP таҳлилидаги турғунлик ҳиссаси билан солиштирилди.`,
  stag_q_cap: "Кунларнинг бешдан бир қисмлари бўйича ўртача хато — энг шамоллидан энг турғунгача",
  stag_q_cols: ["Турғунлик ҳиссаси, AQI", "Кунлар", "Ўртача хато", "Хатонинг ўртача катталиги"],

  season_h: 'Уч ой кунма-кун', days17: '1–7 кунлар:', days890: '8–90 кунлар:', norm_level: v => `±${v} AQI — бу меъёр даражаси`,
  season_note: '1–7 кунлар — соатлик прогнознинг кунлик ўртачаси. Ундан кейинги об-ҳавони ҳеч ким аниқ билмайди, усиз эса муайян ифлос кунни олдиндан айтиб бўлмайди: ойнинг меъёрдан оғиши йилдан-йилга такрорланмайди (корреляция −0,05). Шунинг учун 8–90 кунлар учун қизил кун эҳтимоли кўрсатилади — бу саналар 2018–2026 йилларда қанчалик тез-тез қизил бўлган.',

  full_date: d => `${d.getFullYear()} йил ${d.getDate()} ${I18N.uz.mon_gen[d.getMonth()]}`,
  hist_note: (s, iq) => `Кунлик ўртача AQI, бошланиши: ${s}. ${iq} гача — АҚШ элчихонаси станцияси (Юнусобод), IQAir шкаласига келтирилган; кейин — IQAir бўйича шаҳар ўртачаси. Йилларни эҳтиёткорлик билан солиштиринг: манбалар турлича. Йилни қўшиш ёки олиб ташлаш учун уни босинг.`,
  year_word: y => `${y} й.`, avg_all: 'барча йиллар ўртачаси', avg: 'ўртача', today_l: 'бугун', fc_year: y => `${y} прогнози`, fc_band: y => `${y} прогнози ва 80% оралиқ`,
  month: 'Ой', reds_y: y => `Қизил кунлар ${y}`, with_fc: y => `${y}: прогноз билан`, of: (a, n) => `${n} дан ${a}`, reds_short: r => `≈${r} қизил`,
  acc_h: 'Қанчалик ишониш мумкин', live_since: d => `${d} дан бери амалда:`, live_24: '24 соатга', live_7: 'ҳафтага', live_n: 'прогнозлар:',
  live_wait: 'Амалий текширув: ҳар кунги прогноз сақланади ва ҳақиқий ҳолат билан солиштирилади. Илк рақамлар бир кундан кейин пайдо бўлади.',
  drift: (m, k, n) => `Охирги ${n} кунда эртанги прогноз ўртача ${Math.abs(Math.round(m))} AQI га ${m > 0 ? 'юқори' : 'паст'} бўлди (${n} кундан ${k} кун). Буни ҳисобга олинг: модел бундай силжишни ўзи тузатмайди.`,
  why_eyebrow: 'Прогноз нимадан таркиб топган', why_note: (now, t) => `Бошланғич нуқта — прогноз пайтидаги AQI (${t}): ${now}. Кейин ҳар бир кириш маълумотлари гуруҳи куннинг ўртача AQI сини неча пунктга силжитади; йиғиндиси прогнозни беради. «+» — ҳавони ифлосроқ қилади, «−» — тозароқ.`,
  why_cols: ['Кун', 'Ҳозир', 'Яқиндаги ифлосланиш', 'Мавсумий меъёр', 'Ҳарорат', 'Ҳаво турғунлиги', 'Ёғин ва намлик', 'Бошқа', 'Прогноз'],
  why_caveat: 'Бу физиканинг эмас, моделнинг SHAP усулидаги таҳлили: бир-бири билан боғлиқ кириш маълумотлари ҳиссани шартли бўлишади. Яқиндаги ифлосланиш — охирги кунлардаги даражалар ва тенденциялар; мавсумий меъёр — бу саналар ва соатларда одатда нима бўлади ва ҳозирги ҳаво ундан қанчалик фарқ қилади; ҳарорат — ҳаво ҳарорати ва унинг ўзгариши, бу ҳам об-ҳаво, ҳам иситишга талаб; ҳаво турғунлиги — ер юзаси ва юқоридаги шамол, шамолсизлик, инверсиялар, босим; ёғин ва намлик — ёмғир, қор, намлик, булутлилик, қуёш; бошқа — кун вақти, ҳафта куни, CAMS прогнози. Модел чиқиндиларни бевосита кўрмайди: ифлосланиш кутилгандан қанча кўп ёки кам бўлганини «Тарих» → «Прогноз ва ҳақиқат» бўлимидаги хато таҳлили кўрсатади.',
  live_eyebrow: 'Кунма-кун прогноз ва ҳақиқат — амалда',
  live_empty: 'Ҳар куни эрталаб прогноз сақланади ва кейин бўлиб ўтган ҳолат билан солиштирилади. Биринчи солиштирув эртага, ҳафталиги эса 7 кундан кейин пайдо бўлади. Ўтган прогнозлар орқага қараб тикланмайди: модел у кунларни аллақачон кўрган, бундай текширув ҳалол бўлмас эди.',
  live_note: parts => `Кунлик ўртача AQI: олдиндан нима прогноз қилинган ва нима бўлган. Ўртача хато — ${parts}.`,
  lead1: '1 кун олдин', lead3: '3 кун олдин', lead7: '7 кун олдин', lead_part: (nm, v, n) => `${nm}: ±${v} AQI (${n} кун)`,
  actual: 'ҳақиқат', fc_lead: nm => `прогноз ${nm}`, live_aria: 'Кунма-кун прогноз ва ҳақиқат',
  live_cols: ['Кун', 'Ҳақиқат', '1 кун олдинги прогноз', 'хато', '3 кун олдин', 'хато', '7 кун олдин', 'хато'],
  attr_eyebrow: 'Нега прогноз ҳақиқатдан фарқ қилди',
  attr_parts: ['об-ҳаво', 'ифлосланиш кутилгандан юқори/паст', 'номаълум'],
  attr_note: 'Сайтда кўрсатилган прогнознинг (эрталабки, 1 ёки 3 кун олдинги) хатосини ажратамиз ва уни ўша модел билан яна икки марта ҳисоблаймиз. Об-ҳаво — модел об-ҳаво прогнози ўрнига ҳақиқий об-ҳавони билганида прогноз қанчалик ўзгарарди. Ифлосланиш — ўша куннинг ярим тунидан, ҳақиқий об-ҳаво билан қилинган назорат ҳисоби билан солиштириш: ярим тунга келиб модел қанча ифлосланиш тўпланганини аллақачон билади, шунинг учун фарқ тўғри об-ҳаво билан ҳаво кутилганидан қанчалик ифлос ёки тоза бўлганини кўрсатади (чиқиндилар, иситиш, кўчиб келиш). Номаълум — назорат ҳисобининг ўз хатоси: у ҳам олдиндан кўра олмаган қисм. 7 кунлик прогноз ажратилмайди: у ерда климатология, об-ҳаво иштирок этмайди.',
  attr_bt: (n, a, b) => `Ўтган қишлар (${n} кун, ${a} — ${b}), ҳар бир қисмнинг ўртача катталиги:`, attr_total: 'бутун хато',
  attr_live_note: 'Амалда, кунма-кун; қисмлар йиғиндиси бутун хатога тенг. «+» — бу қисм прогнозни ҳақиқатдан юқори қилди, «−» — паст. Ифлосланиш «+» — ҳаво модел кутганидан тоза бўлган. «Об-ҳаво» — тўғри об-ҳаво билан прогноз қанчага силжиши, хато қанчага камайиши эмас: силжиш ҳақиқатдан узоқлаштириши ҳам мумкин. Ўртача тўғри об-ҳаво 1 кун олдинги хатони тахминан 8% га, 3 кун олдингисини 12% га камайтиради (2024–2026 йиллардаги текширув).',
  attr_live_empty: 'Кунма-кун таҳлил биринчи прогноз куни тугагач пайдо бўлади.',

// Tooltip for the dots of a chart: hover, click or tap shows the dot nearest the pointer
// (within ~24 px) with a ring around it; arrow keys step through the dots. Touch: the tip
// stays until a tap elsewhere. dots: [{ x, y, col, rows: () => [elements] }] in svg units.
function dotTip(host, svg, { W, H, dots }) {
  const ring = sv('circle', { r: 7.5, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5, visibility: 'hidden' });
  const hit = sv('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent', tabindex: 0 });
  svg.append(ring, hit);
  const tip = el('div', { class: 'tip', hidden: '' }); host.append(tip);
  const order = dots.map((_, i) => i).sort((a, b) => dots[a].x - dots[b].x || dots[a].y - dots[b].y);
  let cur = order[order.length - 1];
  const show = i => {
    cur = i; const p = dots[i];
    ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y); ring.setAttribute('stroke', p.col); ring.setAttribute('visibility', 'visible');
    tip.replaceChildren(...p.rows()); tip.hidden = false;
    // beside the dot if it fits, otherwise (phones) below it, or above it
    const sc = host.clientWidth / W, px = p.x * sc, py = p.y * sc, hw = host.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
    let left, top = py - 30;
    if (px + 14 + tw <= hw) left = px + 14;
    else if (px - 14 - tw >= 0) left = px - 14 - tw;
    else { left = Math.min(px - tw / 2, hw - tw); top = py + 14 + th <= host.clientHeight ? py + 14 : py - 14 - th; }
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = Math.max(0, top) + 'px';
  };
  const hide = () => { tip.hidden = true; ring.setAttribute('visibility', 'hidden'); };
  const nearest = e => {
    const r = host.getBoundingClientRect(), sc = host.clientWidth / W;
    const sx = (e.clientX - r.left) / sc, sy = (e.clientY - r.top) / sc;
    let best = -1, bd = 24 / sc;
    dots.forEach((p, i) => { const d = Math.hypot(p.x - sx, p.y - sy); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  hit.addEventListener('pointermove', e => {
    const i = nearest(e);
    hit.style.cursor = i < 0 ? 'default' : 'pointer';
    if (e.pointerType === 'mouse') { if (i < 0) hide(); else show(i); }
  });
  let pointerFocus = false;  // a click focuses the chart too; only keyboard focus opens the last dot
  hit.addEventListener('pointerdown', e => { pointerFocus = true; const i = nearest(e); if (i < 0) hide(); else show(i); });
  hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  hit.addEventListener('focus', () => { if (!pointerFocus && dots.length) show(cur); pointerFocus = false; });
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', e => {
    const k = order.indexOf(cur);
    if (e.key === 'ArrowRight') { show(order[Math.min(order.length - 1, k + 1)]); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { show(order[Math.max(0, k - 1)]); e.preventDefault(); }
  });

// ================================================================ time chart (24 h / week)
function timeChart(host, { obs, fc, ticks, tipTime, height }) {
  const draw = () => {
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth), H = height(W);
    const m = { l: 34, r: 10, t: 10, b: 24 };
    const all = obs.map(r => r[1]).concat(fc.map(r => r[3] ?? r[1]));
    const yMax = Math.max(200, Math.ceil(Math.max(...all) / 50) * 50);
    const t0 = T(obs.length ? obs[0][0] : fc[0][0]).getTime(), t1 = T(fc[fc.length - 1][0]).getTime();
    const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
    const y = v => H - m.b - v / yMax * (H - m.t - m.b);
    const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': L.chart_aria });
    let lo = 0;
    EDGES.forEach((hi, i) => {
      if (lo >= yMax) return;
      const top = Math.min(hi, yMax);
      s.append(sv('rect', { x: m.l, y: y(top), width: W - m.l - m.r, height: y(lo) - y(top), fill: COLS[i], 'fill-opacity': bandOp() }));
      lo = hi;
    });
    for (const v of [50, 100, 150, 200, 300, 400, 500].filter(v => v <= yMax)) {
      s.append(sv('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
      const t = sv('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = v; s.append(t);
    }
    for (const tk of ticks(t0, t1)) {
      const xx = x(tk.t);
      if (xx < m.l + 8 || xx > W - m.r - 8) continue;
      s.append(sv('line', { x1: xx, x2: xx, y1: H - m.b, y2: H - m.b + 4, stroke: 'var(--ink-3)', 'stroke-width': 1 }));
      const t = sv('text', { x: xx, y: H - 6, 'text-anchor': 'middle' }); t.textContent = tk.label; s.append(t);
    }
    const fb = fc.filter(r => r[2] != null && r[3] != null);
    if (fb.length) {
      const up = fb.map(r => `${x(T(r[0]).getTime())},${y(r[3])}`).join(' L');
      const dn = fb.slice().reverse().map(r => `${x(T(r[0]).getTime())},${y(r[2])}`).join(' L');
      s.append(sv('path', { d: `M${up} L${dn} Z`, fill: 'var(--band)' }));
    }
    const line = (rows, col) => {
      if (!rows.length) return;
      s.append(sv('path', { d: 'M' + rows.map(r => `${x(T(r[0]).getTime())},${y(r[1])}`).join(' L'), fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    };
    line(obs, 'var(--ink-2)');
    line(obs.length ? [obs[obs.length - 1]].concat(fc) : fc, 'var(--accent)');
    const xn = x(origin.getTime());
    s.append(sv('line', { x1: xn, x2: xn, y1: m.t, y2: H - m.b, stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-opacity': 0.5 }));
    const nt = sv('text', { x: xn + 5, y: m.t + 11, class: 'lbl' }); nt.textContent = L.issue_mark; s.append(nt);
    const pts = obs.map(r => ({ t: T(r[0]).getTime(), v: r[1], kind: L.measured }))
      .concat(fc.map(r => ({ t: T(r[0]).getTime(), v: r[1], lo: r[2], hi: r[3], kind: L.forecast })));
    const cross = sv('line', { y1: m.t, y2: H - m.b, stroke: 'var(--ink)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = sv('circle', { r: 4.5, fill: 'var(--surface)', stroke: 'var(--ink)', 'stroke-width': 2, visibility: 'hidden' });
    s.append(cross, dot);
    const hit = sv('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent', tabindex: 0 });
    s.append(hit);
    host.append(s);
    const tip = el('div', { class: 'tip', hidden: '' });
    host.append(tip);
    const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
    const show = i => {
      const p = pts[i]; const xx = x(p.t), yy = y(p.v);
      cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', xx); dot.setAttribute('cy', yy); dot.setAttribute('visibility', 'visible');
      tip.replaceChildren(el('div', { class: 'v' }, String(Math.round(p.v))),
        el('div', { class: 't' }, tipTime(new Date(p.t)) + ' · ' + p.kind),
        el('div', { class: 'r' }, p.lo != null ? `80%: ${Math.round(p.lo)}–${Math.round(p.hi)}` : label(p.v)));
      tip.hidden = false;
      const sc = host.clientWidth / W;
      tip.style.left = (xx * sc + 12 + tip.offsetWidth > host.clientWidth ? xx * sc - tip.offsetWidth - 12 : xx * sc + 12) + 'px';
      tip.style.top = Math.max(0, yy * sc - 30) + 'px';
    };
    let cur = pts.length - fc.length;
    const nearest = cx => { const svgX = cx / host.clientWidth * W; let best = 0, bd = Infinity; pts.forEach((p, i) => { const d = Math.abs(x(p.t) - svgX); if (d < bd) { bd = d; best = i; } }); return best; };
    const pick = e => { const r = host.getBoundingClientRect(); cur = nearest(e.clientX - r.left); show(cur); };
    hit.addEventListener('pointermove', pick);
    hit.addEventListener('pointerdown', pick);  // a tap on a phone
    hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    hit.addEventListener('focus', () => show(cur));
    hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { cur = Math.min(pts.length - 1, cur + 1); show(cur); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { cur = Math.max(0, cur - 1); show(cur); e.preventDefault(); }
    });
  };
  draw();
  watch(host, draw);
}
const hourTicks = step => (t0, t1) => {
  const out = []; const d = new Date(t0); d.setMinutes(0, 0, 0);
  while (d.getHours() % step) d.setHours(d.getHours() + 1);
  for (; d.getTime() <= t1; d.setHours(d.getHours() + step)) out.push({ t: d.getTime(), label: d.getHours() === 0 ? d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0') : hh(d).slice(0, 2) });
  return out;
};
const dayTicks = (t0, t1) => {
  const out = []; const d = new Date(t0); d.setHours(24, 0, 0, 0);
  for (; d.getTime() <= t1; d.setDate(d.getDate() + 1)) out.push({ t: d.getTime() + 12 * 3600e3, label: L.wd[d.getDay()] + ' ' + d.getDate() });
  return out;
};
