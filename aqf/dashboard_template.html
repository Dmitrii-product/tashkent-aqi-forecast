  mkChip(L.avg_all, 'var(--ink-3)', SHOW_AVG, on => { SHOW_AVG = on; });
  const fy = origin.getFullYear();
  const FC = D.d.map(r => [new Date(r[0].slice(0, 10) + 'T00:00'), r[1], r[2], r[3], r[6]]).filter(r => r[0].getFullYear() === fy);
  const draw = () => {
    const ys = YEARS.filter(y => SEL.has(y));
    const series = ys.map(y => ({ y, rows: byYear.get(y), col: colorOf(y) }));  // each day as measured
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth), Hh = W < 500 ? 230 : 280;
    const m = { l: 34, r: 12, t: 10, b: 24 };
    const vals = series.flatMap(s => s.rows.map(r => r[1])).concat(SHOW_AVG ? AVG.map(r => r[1]) : []).filter(v => v != null);
    const yMax = Math.max(200, Math.ceil(Math.max(0, ...vals) / 50) * 50);
    const x = dd => m.l + dd / 365 * (W - m.l - m.r), yv = v => Hh - m.b - v / yMax * (Hh - m.t - m.b);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${Hh}`, role: 'img', 'aria-label': L.hist_eyebrow + ': ' + ys.join(', ') });
    let lo = 0;
    EDGES.forEach((hi, i) => { if (lo >= yMax) return; svg.append(sv('rect', { x: m.l, y: yv(Math.min(hi, yMax)), width: W - m.l - m.r, height: yv(lo) - yv(Math.min(hi, yMax)), fill: COLS[i], 'fill-opacity': bandOp() })); lo = hi; });
    for (const v of [50, 100, 150, 200, 300].filter(v => v <= yMax)) {
      svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: yv(v), y2: yv(v), stroke: 'var(--line)', 'stroke-width': 1 }));
      const t = sv('text', { x: m.l - 6, y: yv(v) + 4, 'text-anchor': 'end' }); t.textContent = v; svg.append(t);
    }
    for (let mo = 0; mo < 12; mo++) { const t = sv('text', { x: x(doy(new Date(2001, mo, 15))), y: Hh - 6, 'text-anchor': 'middle' }); t.textContent = L.mon_short[mo]; svg.append(t); }
    const path = (rows, col, wdt, op) => {
      let d = '', pen = false;
      for (const r of rows) { if (r[1] == null) { pen = false; continue; } d += (pen ? ' L' : ' M') + `${x(doy(r[0]))},${yv(r[1])}`; pen = true; }
      if (d) svg.append(sv('path', { d, fill: 'none', stroke: col, 'stroke-width': wdt, 'stroke-opacity': op, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    };
    if (SHOW_AVG) path(AVG, 'var(--ink-3)', 5, 0.45);
    if (SEL.has(fy) && FC.length) {  // the forecast continues the current year: lighter line + 80% band
      const col = colorOf(fy);
      const up = FC.map(r => `${x(doy(r[0]))},${yv(r[3])}`).join(' L');
      const dn = FC.slice().reverse().map(r => `${x(doy(r[0]))},${yv(r[2])}`).join(' L');
      svg.append(sv('path', { d: `M${up} L${dn} Z`, fill: col, 'fill-opacity': 0.14 }));
      // start from the last actual day, so the forecast continues the actual line
      const joint = (byYear.get(fy) || []).filter(r => r[1] != null).slice(-1);
      const contiguous = joint.length && doy(FC[0][0]) - doy(joint[0][0]) === 1;
      path([...(contiguous ? joint : []), ...FC.map(r => [r[0], r[1]])], col, 2, 0.55);
      const xn = x(doy(origin));
      svg.append(sv('line', { x1: xn, x2: xn, y1: m.t, y2: Hh - m.b, stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-opacity': 0.4 }));
      const tt = sv('text', { x: xn + 4, y: m.t + 11, class: 'lbl' }); tt.textContent = L.today_l; svg.append(tt);
    }
    [...series].reverse().forEach(s => path(s.rows, s.col, s.y === ys[0] ? 2.5 : 1.8, 1));
    const cross = sv('line', { y1: m.t, y2: Hh - m.b, stroke: 'var(--ink)', 'stroke-width': 1, visibility: 'hidden' });
    svg.append(cross);
    const hit = sv('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: Hh - m.t - m.b, fill: 'transparent', tabindex: 0 });
    svg.append(hit);
    host.append(svg);
    const tip = el('div', { class: 'tip', hidden: '' }); host.append(tip);
    const hideTip = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); };
    const idx = series.map(s => new Map(s.rows.map(r => [doy(r[0]), r])));
    const avgIdx = new Map(AVG.map(r => [doy(r[0]), r]));
    const fcIdx = new Map(FC.map(r => [doy(r[0]), r]));
    const pick = e => {
      const rect = host.getBoundingClientRect(), sx = (e.clientX - rect.left) / host.clientWidth * W;
      const dd = Math.max(0, Math.min(365, Math.round((sx - m.l) / (W - m.l - m.r) * 365)));
      cross.setAttribute('x1', x(dd)); cross.setAttribute('x2', x(dd)); cross.setAttribute('visibility', 'visible');
      const lines = [el('div', { class: 't' }, dm(new Date(2001, 0, 1 + dd)))];
      // the measured value where there is one; for the current year after the last measured day, the forecast
      const f = SEL.has(fy) ? fcIdx.get(dd) : null;
      series.forEach((s, i) => {
        const r = idx[i].get(dd), cls = i === 0 ? 'v' : 't';
        if (r && r[1] != null) lines.push(el('div', { class: cls }, `${s.y}: ${Math.round(r[1])}`));
        else if (s.y === fy && f) lines.push(el('div', { class: cls }, `${L.fc_year(fy)}: ≈${Math.round(f[1])}`), el('div', { class: 'r' }, `80%: ${Math.round(f[2])}–${Math.round(f[3])}`));
        else lines.push(el('div', { class: cls }, `${s.y}: —`));
      });
      if (SHOW_AVG) { const r = avgIdx.get(dd); lines.push(el('div', { class: 'r' }, `${L.avg}: ${r && r[1] != null ? Math.round(r[1]) : '—'}`)); }
      tip.replaceChildren(...lines);
      tip.hidden = false;
      const sc = host.clientWidth / W, px = x(dd) * sc;
      tip.style.left = (px + 12 + tip.offsetWidth > host.clientWidth ? px - tip.offsetWidth - 12 : px + 12) + 'px';
      tip.style.top = '8px';
    };
    hit.addEventListener('pointermove', pick);
    hit.addEventListener('pointerdown', pick);  // a tap on a phone; the tip stays until a tap elsewhere
    hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    hit.addEventListener('blur', hideTip);
    const lg = $('hist-legend'); lg.replaceChildren();
    const key = (col, text, band) => { const sp = el('span'); const k = el('i', { class: band ? 'key-band' : 'key-line' }); k.style.background = col; if (band) k.style.opacity = '0.35'; sp.append(k, document.createTextNode(text)); lg.append(sp); return k; };
    for (const s of series) key(s.col, String(s.y));
    if (SHOW_AVG) key('var(--ink-3)', L.avg_all).style.height = '4px';
    if (SEL.has(fy)) key(colorOf(fy), L.fc_band(fy), true);
    // monthly table: one column per selected year (+ current year with forecast)
    const tb = $('thist'); tb.replaceChildren();
    const hd = el('tr'); hd.append(el('th', {}, L.month));
    for (const y of ys) hd.append(el('th', {}, String(y)));
    for (const y of ys) hd.append(el('th', {}, L.reds_y(y)));
    const withFc = SEL.has(fy);
    if (withFc) hd.append(el('th', {}, L.with_fc(fy)));
    const th = el('thead'); th.append(hd); tb.append(th);
    const body = el('tbody');
    // a month needs 10 measured days, except the current one: shown from its first day and updated
    // with every run ("Red days" says how many days it has so far)
    const curY = origin.getFullYear(), curM = origin.getMonth();
    const stat = (rows, mo, y) => { const v = rows.filter(r => r[0].getMonth() === mo && r[1] != null).map(r => r[1]); return v.length >= (y === curY && mo === curM ? 1 : 10) ? { mean: v.reduce((a, b) => a + b, 0) / v.length, red: v.filter(x => x > 150.5).length, n: v.length } : null; };
    const chipTd = st => { const td = el('td'); if (!st) { td.textContent = '—'; return td; } const c = el('span', { class: 'chipc' }, String(Math.round(st.mean))); c.style.background = fill(st.mean); td.append(c); return td; };
    const today0 = new Date(origin.getFullYear(), origin.getMonth(), origin.getDate());
    for (let mo = 0; mo < 12; mo++) {
      const st = ys.map(y => stat(byYear.get(y) || [], mo, y));
      if (st.every(v => !v)) continue;
      const tr = el('tr'); tr.append(el('td', { style: 'font-family:var(--f-body)' }, L.mon[mo]));
      st.forEach(v => tr.append(chipTd(v)));
      st.forEach(v => tr.append(el('td', {}, v ? L.of(v.red, v.n) : '—')));
      if (withFc) {
        const obsRows = (byYear.get(fy) || []).filter(r => r[0].getMonth() === mo && r[1] != null && r[0] < today0);
        const fcRows = FC.filter(r => r[0].getMonth() === mo);
        const td = el('td');
        if (fcRows.length) {
          const n = obsRows.length + fcRows.length;
          const mean = (obsRows.reduce((a, r) => a + r[1], 0) + fcRows.reduce((a, r) => a + r[1], 0)) / n;
          const red = obsRows.filter(r => r[1] > 150.5).length + fcRows.reduce((a, r) => a + (r[4] || 0), 0);
          const c = el('span', { class: 'chipc' }, '≈' + Math.round(mean)); c.style.background = fill(mean);
          td.append(c, document.createTextNode(' · ' + L.reds_short(Math.round(red))));
        } else td.textContent = '—';
        tr.append(td);
      }
      body.append(tr);
    }
    tb.append(body);
  };
  draw();
  watch(host, draw);
}

// ================================================================ about tab: SHAP and stagnant air in detail
function renderDeep() {
  const st = $('shap-text'); st.replaceChildren();
  for (const p of L.shap_p) st.append(el('p', {}, p));
  st.append(el('p', {}, L.shap_groups_h));
  const ul = el('ul'); for (const g of L.shap_groups) ul.append(el('li', {}, g)); st.append(ul);
  const w = (D.why || [])[0];
  if (w) {  // whole numbers that add up, as in the week table
    const d = new Date(w.date + 'T00:00'), now = Math.round(w.now), fc = Math.round(w.forecast);
    const v = ['recent', 'season', 'temperature', 'stagnation', 'wet'].map(k => Math.round(w[k] || 0));
    st.append(el('p', {}, L.shap_example(`${L.wd[d.getDay()]}, ${dm(d)}`, now, ...[...v, fc - now - v.reduce((a, b) => a + b, 0)].map(signed), fc)));
  }
  const S = D.stag || {};
  $('stag-more').hidden = !S.all;
  if (!S.all) return;
  const tx = $('stag-text'); tx.replaceChildren();
  for (const p of L.stag_p) tx.append(el('p', {}, p));
  tx.append(el('p', {}, L.stag_method(S.all.days, L.full_date(new Date(S.from + 'T00:00')), L.full_date(new Date(S.to + 'T00:00')))));
  const cap = text => el('caption', { style: 'text-align:left; padding-bottom:8px; font-weight:600; font-size:14px' }, text);
  const table = (id, caption, cols, rows) => {
    const t = $(id); t.replaceChildren(); t.append(cap(caption));
    const hd = el('tr'); for (const h of cols) hd.append(el('th', {}, h));
    const th = el('thead'); th.append(hd); t.append(th);
    const body = el('tbody'); for (const r of rows) { const tr = el('tr'); for (const c of r) tr.append(el('td', {}, String(c))); body.append(tr); }
    t.append(body);
  };
  const f2 = x => (x > 0 ? '+' : '') + Number(x).toFixed(2);  // slopes
  const pm = (b, ci) => ci == null ? '—' : `${f2(b)} ± ${Number(ci).toFixed(2)}`;
  table('tstag-q', L.stag_q_cap, L.stag_q_cols, (S.by_stagnation_quintile || []).map(q =>
    [q.stagnation.replace('..', '…'), q.days, signed(Math.round(q.mean_error)), '±' + Math.round(q.mae)]));
  table('tstag-w', L.stag_w_cap, L.stag_w_cols, Object.entries(S.by_winter || {}).map(([y, r]) =>
    [`${y}/${String(+y + 1).slice(2)}`, r.days, signed(Math.round(r.mean_error)), f2(r.b), pm(r.b_month, r.b_month_ci)]));
  // verdicts follow the numbers, so a monthly re-run can change the wording
  const A = S.all, verdict = Math.abs(A.b_month) < A.b_month_ci ? L.stag_v0 : A.b_month < 0 ? L.stag_vneg : L.stag_vpos;
  const C = S.current, seasonOf = m => +m.slice(0, 4) - (+m.slice(5, 7) < 7 ? 1 : 0);
  const big = (S.by_month || []).filter(m => m.days >= 15 && Math.abs(m.mean_error) >= 12 && (!C || seasonOf(m.month) < C.season))
    .sort((a, b) => Math.abs(b.mean_error) - Math.abs(a.mean_error)).slice(0, 5)
    .map(m => { const d = new Date(m.month + '-01T00:00'); return `${d.toLocaleDateString(L.locale, { month: 'long', year: 'numeric' })} ${signed(Math.round(m.mean_error))}`; });
  let text = L.stag_all(verdict, f2(A.b_month), Number(A.b_month_ci).toFixed(2), big.join(', '));
  if (C) text += ' ' + L.stag_cur(C.days, f2(C.b), C.b_ci.toFixed(2), f2(C.b_time), C.b_time_ci.toFixed(2), C.corr_time.toFixed(2)) + ' ' +
    (Math.abs(C.b_time) < C.b_time_ci ? L.stag_cur0 : C.b_time > 0 ? L.stag_curpos : L.stag_curneg);
  $('stag-concl').textContent = text;
}

// ================================================================ week: what the forecast is made of (aqf.explain)
function renderWhy() {
  const rows = D.why || [];
  $('why').hidden = !rows.length;
  if (!rows.length) return;
  // since model version 2026-11-04 the network's shift of the day is a column of its own
  const hasNN = rows.some(r => r.nn != null);
  $('why-note').textContent = L.why_note(Math.round(rows[0].now), hh(origin)) + (hasNN ? L.why_nn_note : '');
  const tb = $('twhy'); tb.replaceChildren();
  const cols = hasNN ? [...L.why_cols.slice(0, -1), L.why_nn, L.why_cols[L.why_cols.length - 1]] : L.why_cols;
  const hd = el('tr'); for (const h of cols) hd.append(el('th', {}, h));
  const th = el('thead'); th.append(hd); tb.append(th);
  const body = el('tbody');
  for (const r of rows) {
    // whole numbers that add up to the forecast; the rounding remainder goes to "other"
    const d = new Date(r.date + 'T00:00'), now = Math.round(r.now), fc = Math.round(r.forecast);
    const v = ['recent', 'season', 'temperature', 'stagnation', 'wet'].map(k => Math.round(r[k] || 0));
    const nn = hasNN ? Math.round(r.nn || 0) : 0;
    const parts = [...v, fc - now - nn - v.reduce((a, b) => a + b, 0), ...(hasNN ? [nn] : [])];
    const tr = el('tr');
    tr.append(el('td', { style: 'font-family:var(--f-body)' }, `${L.wd[d.getDay()]}, ${dm(d)}`), el('td', {}, String(now)));
    for (const x of parts) tr.append(el('td', { class: x > 0 ? 'up' : x < 0 ? 'down' : '' }, signed(x)));
    tr.append(el('td', { class: 'best' }, String(fc)));
    body.append(tr);
  }
  tb.append(body);
}

// ================================================================ live: forecast vs actual
function renderLive() {
  const LV = D.live || {}, days = LV.days || [];
  const note = $('live-note'), tb = $('tlive'), host = $('clive'), lg = $('live-legend');
  tb.replaceChildren(); host.replaceChildren(); lg.replaceChildren();
  const LEADS = [[1, L.lead1, 'var(--s1)'], [3, L.lead3, 'var(--s2)'], [7, L.lead7, 'var(--s3)']];
  const scored = days.filter(r => r.act != null && LEADS.some(([k]) => r['f' + k] != null));
  // model versions: while the table holds forecasts of more than one, the newest one's are marked
  const MV = D.model || {}, NEWV = MV.current, CV = (MV.versions || []).find(v => v.id === NEWV);
  const mixed = new Set(days.flatMap(r => LEADS.map(([k]) => r['v' + k]).filter(Boolean))).size > 1;
  const newScored = days.some(r => r.act != null && LEADS.some(([k]) => r['v' + k] === NEWV && r['f' + k] != null));
  const lv = $('live-ver');
  lv.hidden = !(CV && MV.versions.length > 1 && (!CV.first || mixed || !newScored));
  if (!lv.hidden) lv.textContent = CV.first ? L.live_ver_on(dmy(day0(CV.id)), when(CV.first), newScored) : L.live_ver_wait(dmy(day0(CV.id)));
  host.hidden = !scored.length;
  if (!scored.length) note.textContent = L.live_empty;
  else {
    note.textContent = L.live_note(LEADS.filter(([k]) => LV['daily_lead' + k]).map(([k, nm]) => L.lead_part(nm, Math.round(LV['daily_lead' + k].mae), LV['daily_lead' + k].n)).join(', '));
    const draw = () => {
      host.replaceChildren();
      const W = Math.max(280, host.clientWidth), Hh = W < 500 ? 200 : 230;
      const m = { l: 34, r: 12, t: 10, b: 24 };
      const vals = scored.flatMap(r => [r.act, ...LEADS.map(([k]) => r['f' + k])]).filter(v => v != null);
      const yMax = Math.max(150, Math.ceil(Math.max(...vals) / 50) * 50);
      const n = scored.length;
      const x = i => m.l + (n === 1 ? 0.5 : i / (n - 1)) * (W - m.l - m.r), yv = v => Hh - m.b - v / yMax * (Hh - m.t - m.b);
      const svg = sv('svg', { viewBox: `0 0 ${W} ${Hh}`, role: 'img', 'aria-label': L.live_aria });
      for (const v of [50, 100, 150, 200, 300].filter(v => v <= yMax)) {
        svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: yv(v), y2: yv(v), stroke: 'var(--line)', 'stroke-width': 1 }));
        const t = sv('text', { x: m.l - 6, y: yv(v) + 4, 'text-anchor': 'end' }); t.textContent = v; svg.append(t);
      }
      scored.forEach((r, i) => { if (i % Math.ceil(n / 8) === 0 || i === n - 1) { const d = new Date(r.date + 'T00:00'); const t = sv('text', { x: x(i), y: Hh - 6, 'text-anchor': 'middle' }); t.textContent = d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0'); svg.append(t); } });
      // the first day with the new model version's 1-day-ahead forecast
      const iv = mixed ? scored.findIndex(r => r.v1 === NEWV) : -1;
      if (iv > 0) {
        svg.append(sv('line', { x1: x(iv), x2: x(iv), y1: m.t, y2: Hh - m.b, stroke: 'var(--ink-3)', 'stroke-width': 1, 'stroke-dasharray': '4 3' }));
        const right = x(iv) > W * 0.7, t = sv('text', { x: x(iv) + (right ? -4 : 4), y: m.t + 10, 'text-anchor': right ? 'end' : 'start' });
        t.textContent = L.ver_mark; svg.append(t);
      }
      // forecast lines under the actual one; a day without that forecast breaks its line
      for (const [k, , col] of LEADS) {
        const d = scored.map((r, i) => r['f' + k] == null ? null : `${i && scored[i - 1]['f' + k] != null ? 'L' : 'M'}${x(i)},${yv(r['f' + k])}`).filter(Boolean).join(' ');
        if (d) svg.append(sv('path', { d, fill: 'none', stroke: col, 'stroke-width': 1.75, 'stroke-linejoin': 'round' }));
      }
      svg.append(sv('path', { d: 'M' + scored.map((r, i) => `${x(i)},${yv(r.act)}`).join(' L'), fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2 }));
      // a dot per day too: a path through a single day draws nothing
      scored.forEach((r, i) => svg.append(sv('circle', { cx: x(i), cy: yv(r.act), r: 3.5, fill: 'var(--ink)' })));
      for (const [k, , col] of LEADS) scored.forEach((r, i) => { if (r['f' + k] != null) svg.append(sv('circle', { cx: x(i), cy: yv(r['f' + k]), r: 4, fill: col, stroke: 'var(--surface)', 'stroke-width': 2 })); });
      host.append(svg);
      const dots = scored.flatMap((r, i) => {
        const d = new Date(r.date + 'T00:00'), day = `${L.wd[d.getDay()]}, ${dm(d)}`;
        return [{ x: x(i), y: yv(r.act), col: 'var(--ink)', rows: () => [el('div', { class: 'v' }, String(r.act)), tipRow('var(--ink)', `${L.actual} · ${day}`)] },
          ...LEADS.filter(([k]) => r['f' + k] != null).map(([k, nm, col]) => ({
            x: x(i), y: yv(r['f' + k]), col,
            rows: () => [el('div', { class: 'v' }, String(r['f' + k])), tipRow(col, `${L.fc_lead(nm)} · ${day}`),
              el('div', { class: 'r' }, `${L.live_cols[3]} ${signed(r['f' + k] - r.act)}`)],
          }))];
      });
      dotTip(host, svg, { W, H: Hh, dots });
    };
    draw(); watch(host, draw);
    { const sp = el('span'); const k = el('i', { class: 'key-line' }); k.style.background = 'var(--ink)'; sp.append(k, document.createTextNode(L.actual)); lg.append(sp); }
    for (const [, nm, col] of LEADS) { const sp = el('span'); const k = el('i', { class: 'key-line' }); k.style.background = col; sp.append(k, document.createTextNode(L.fc_lead(nm))); lg.append(sp); }
  }
  tb.hidden = !days.length;
  const hd = el('tr'); for (const h of L.live_cols) hd.append(el('th', {}, h));
  const th = el('thead'); th.append(hd); tb.append(th);
  const body = el('tbody');
  for (const r of [...days].reverse()) {
    const tr = el('tr'); const d = new Date(r.date + 'T00:00');
    tr.append(el('td', { style: 'font-family:var(--f-body)' }, `${L.wd[d.getDay()]}, ${dm(d)}`), el('td', { class: 'best' }, r.act == null ? '…' : String(r.act)));
    for (const [k] of LEADS) {
      const f = r['f' + k];
      const nv = mixed && f != null && r['v' + k] === NEWV;
      tr.append(el('td', nv ? { class: 'nv', title: L.nv_title } : {}, f == null ? '—' : String(f)), el('td', {}, f == null || r.act == null ? '—' : signed(f - r.act)));
    }
    body.append(tr);
  }
  tb.append(body);
}

// ================================================================ model versions (aqf.models.MODEL_VERSIONS), about tab
function renderVersions() {
  const MV = D.model || {}, VS = MV.versions || [], list = $('ver-list');
  list.replaceChildren();
  $('changes').hidden = !VS.length;
  for (const v of [...VS].reverse()) {
    const cur = v.id === MV.current, box = el('div', { class: 'ver' });
    box.append(el('h3', {}, L.ver_title(dmy(day0(v.id)), cur)), el('p', {}, L.ver_what[v.id] || ''),
      el('p', { class: 'small' }, v.first ? L.ver_issued(when(v.first), v.last && when(v.last), v.n, cur) : L.ver_none));
    if (v.backtest) {
      const tb = el('table', { class: 'cmp' }), hd = el('tr'), th = el('thead'), body = el('tbody');
      for (const h of L.ver_bt_cols) hd.append(el('th', {}, h));
      th.append(hd); tb.append(th);
      for (const r of v.backtest) {
        const tr = el('tr');
        const ch = el('td', r.ci[1] < 0 ? { class: 'best' } : {});
        ch.append(el('div', {}, `${sgn(r.diff, 2)} (${sgn(100 * r.diff / r.mae, 1)}%)`), el('div', { class: 'ci' }, `${sgn(r.ci[0], 2)}…${sgn(r.ci[1], 2)}`));
        tr.append(el('td', {}, L.ver_period[r.period] || r.period), el('td', {}, `±${r.mae.toFixed(1)}`), ch);
        body.append(tr);
      }
      tb.append(body);
      const wrap = el('div', { class: 'tbl-wrap' }); wrap.append(tb);
      box.append(wrap, el('p', { class: 'muted small' }, L.ver_bt_note));
    }
    list.append(box);
  }
}

// ================================================================ neural network in the shadow (aqf.nn shadow)
function renderShadow() {
  const S = (D.live || {}).shadow, bt = (D.nn_bt || []).filter(r => r.hours === '1-168');
  const KEYS = ['day', 'week', 'lead1', 'lead3'].filter(k => S && S[k]);
  $('sh-n').textContent = S ? L.sh_n(S.n, S.backfilled) + (KEYS.length ? '' : ' ' + L.sh_empty) : L.sh_empty;
  const tb = $('tshadow'); tb.replaceChildren(); tb.hidden = !KEYS.length;
  if (KEYS.length) {
    const hd = el('tr'); for (const h of L.sh_cols) hd.append(el('th', {}, h));
    const th = el('thead'); th.append(hd); tb.append(th);
    const body = el('tbody');
    for (const k of KEYS) {
      const r = S[k], best = Math.min(r.gbm, r.nn, r.blend), tr = el('tr');
      tr.append(el('td', { style: 'font-family:var(--f-body)' }, L.sh_rows[k]));
      for (const m of ['gbm', 'nn', 'blend']) tr.append(el('td', r[m] === best ? { class: 'best' } : {}, '±' + r[m].toFixed(1)));
      tr.append(el('td', {}, `${r.n} ${L.sh_unit[k]}`));
      body.append(tr);
    }
    tb.append(body);

  $('sh-bt').textContent = bt.length ? L.sh_bt(bt.map(r => `${L.sh_season(r.season)}: LightGBM ±${r.pred.toFixed(1)} → ${L.sh_arrow} ±${r.blend7.toFixed(1)}`).join('; ')) + ' ' + L.sh_later : L.sh_later;
}

// ================================================================ SILAM (FMI) vs our forecast vs fact (aqf.silam)
function renderSilam() {
  const S = D.silam || {}, KEYS = ['h1_24', 'h25_72', 'lead1', 'lead2', 'lead3'].filter(k => S[k]);
  $('silam').hidden = !S.runs;
  $('si-n').textContent = !S.runs ? '' : KEYS.length ? L.si_n(S.n_forecasts, S.runs) : L.si_empty;
  const tb = $('tsilam'); tb.replaceChildren(); tb.hidden = !KEYS.length;
  if (KEYS.length) {
    const hd = el('tr'); for (const h of L.si_cols) hd.append(el('th', {}, h));
    const th = el('thead'); th.append(hd); tb.append(th);
    const body = el('tbody');
    for (const k of KEYS) {
      const r = S[k], M = ['ours', 'silam', 'corr'], best = Math.min(...M.filter(m => r[m] != null).map(m => r[m])), tr = el('tr');
      tr.append(el('td', { style: 'font-family:var(--f-body)' }, L.si_rows[k]));
      for (const m of M) tr.append(el('td', r[m] === best ? { class: 'best' } : {}, r[m] == null ? '—' : '±' + r[m].toFixed(1)));
      tr.append(el('td', {}, `${r.n} ${L.si_unit[k]}`));
      body.append(tr);
    }
    tb.append(body);
  }
  const A = S.alone, day = s => dm(new Date(s + 'T00:00'));
  $('si-alone').textContent = A && A.corr != null ? L.si_alone(day(A.from), day(A.to), A.n, A.silam.toFixed(1), A.silam_bias, A.silam_r ?? null, A.corr.toFixed(1), A.corr_bias) : '';
  // by day: the fact, and of each side the newest forecast published before the day began
  const DY = S.days || [], host = $('csilam'), lg = $('si-legend');
  host.replaceChildren(); lg.replaceChildren();
  host.hidden = lg.hidden = $('si-days-note').hidden = !DY.length;
  if (!DY.length) return;
  // SILAM corrected by the measurements: SILAM's colour, dashed, hollow dots
  const SER = [['act', L.actual, 'var(--ink)'], ['ours', L.si_ours, 'var(--s1)'], ['silam', L.si_silam, 'var(--s2)'], ['corr', L.si_corr, 'var(--s2)']];
  const today = DY.findIndex(r => r.date >= D.meta.generated_at.slice(0, 10));
  const draw = () => {
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth), Hh = W < 500 ? 200 : 230, n = DY.length;
    const m = { l: 34, r: 12, t: 10, b: 24 };
    const vals = DY.flatMap(r => SER.map(([k]) => r[k])).filter(v => v != null);
    const yMax = Math.max(150, Math.ceil(Math.max(...vals) / 50) * 50);
    const x = i => m.l + (n === 1 ? 0.5 : i / (n - 1)) * (W - m.l - m.r), yv = v => Hh - m.b - v / yMax * (Hh - m.t - m.b);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${Hh}`, role: 'img', 'aria-label': L.si_aria });
    for (const v of [50, 100, 150, 200, 300].filter(v => v <= yMax)) {
      svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: yv(v), y2: yv(v), stroke: 'var(--line)', 'stroke-width': 1 }));
      const t = sv('text', { x: m.l - 6, y: yv(v) + 4, 'text-anchor': 'end' }); t.textContent = v; svg.append(t);
    }
    const every = Math.ceil(n / (W < 500 ? 5 : 8));
    DY.forEach((r, i) => { if (i % every === 0) { const d = new Date(r.date + 'T00:00'); const t = sv('text', { x: x(i), y: Hh - 6, 'text-anchor': 'middle' }); t.textContent = d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0'); svg.append(t); } });
    if (today > 0) {
      const tx = (x(today - 1) + x(today)) / 2;
      svg.append(sv('line', { x1: tx, x2: tx, y1: m.t, y2: Hh - m.b, stroke: 'var(--ink-3)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));
      const t = sv('text', { x: tx + 4, y: m.t + 10 }); t.textContent = L.si_today; svg.append(t);
    }
    // forecasts under the fact; a day without a value breaks its line
    for (const [k, , col] of [...SER].reverse()) {
      const d = DY.map((r, i) => r[k] == null ? null : `${i && DY[i - 1][k] != null ? 'L' : 'M'}${x(i)},${yv(r[k])}`).filter(Boolean).join(' ');
      if (d) svg.append(sv('path', { d, fill: 'none', stroke: col, 'stroke-width': k === 'act' ? 2 : 1.75, 'stroke-linejoin': 'round', ...(k === 'corr' ? { 'stroke-dasharray': '5 4' } : {}) }));
    }
    for (const [k, , col] of [...SER].reverse()) DY.forEach((r, i) => { if (r[k] != null) svg.append(sv('circle', { cx: x(i), cy: yv(r[k]), r: 3, ...(k === 'corr' ? { fill: 'var(--surface)', stroke: col, 'stroke-width': 1.5 } : { fill: col }) })); });
    host.append(svg);
    const dots = DY.flatMap((r, i) => {
      const d = new Date(r.date + 'T00:00'), dd = `${L.wd[d.getDay()]}, ${dm(d)}`;
      return SER.filter(([k]) => r[k] != null).map(([k, nm, col]) => ({
        x: x(i), y: yv(r[k]), col,
        rows: () => k === 'act' ? [el('div', { class: 'v' }, String(r.act)), tipRow(col, `${nm} · ${dd}`)]
          : [el('div', { class: 'v' }, String(r[k])), tipRow(col, `${L.si_issued(nm, day(r[k + '_from']))} · ${dd}`),
            ...(r.act == null ? [] : [el('div', { class: 'r' }, `${L.live_cols[3]} ${signed(r[k] - r.act)}`)])],
      }));
    });
    dotTip(host, svg, { W, H: Hh, dots });
  };
  draw(); watch(host, draw);
  for (const [key, nm, col] of SER) {
    const sp = el('span'); const k = el('i', { class: 'key-line' });
    k.style.background = key === 'corr' ? `repeating-linear-gradient(90deg, ${col} 0 5px, transparent 5px 8px)` : col;
    sp.append(k, document.createTextNode(nm)); lg.append(sp);
  }
}

// ================================================================ emission-cut scenario (aqf.scenario), its own tab
let SCEN = 'moderate';
function renderScenario() {
  const S = D.scen || {}, SS = S.scenarios || [], ok = SS.length > 0 && SS.every(x => x.months && x.days);
  $('sc-intro').textContent = ok ? L.sc_intro : L.sc_empty;
  for (const id of ['sc-source', 'sc-cmp-card', 'sc-pick-row', 'sc-days-card', 'sc-months-card', 'sc-winters-card', 'sc-caveats-card']) $(id).hidden = !ok;
  if (!ok) return;
  const [pre, title, post] = L.sc_src;
  $('sc-source').replaceChildren(document.createTextNode(pre), el('a', { href: S.report, target: '_blank', rel: 'noopener' }, title), document.createTextNode(post));
  const to = (a, b) => `${a} → ${b}`, pct = v => (v < 0 ? '−' : v > 0 ? '+' : '') + Math.abs(Math.round(v)) + '%';
  const table = (id, cols, rows) => {
    const tb = $(id); tb.replaceChildren();
    const hd = el('tr'); for (const h of cols) hd.append(el('th', {}, h));
    const th = el('thead'); th.append(hd);
    const body = el('tbody');
    for (const r of rows) { const tr = el('tr'); r.forEach((v, i) => tr.append(el('td', i ? {} : { style: 'font-family:var(--f-body)' }, v))); body.append(tr); }
    tb.append(th, body);
    return body;
  };
  const sum = (W, k) => W.reduce((a, w) => a + w[k], 0), wmean = (W, k) => Math.round(W.reduce((a, w) => a + w[k] * w.days, 0) / sum(W, 'days'));
  const dmean = (dd, k) => Math.round(dd.reduce((a, r) => a + r[k], 0) / dd.length);

  // both scenarios side by side: rows = what is cut and what it gives, columns = no cuts / each scenario
  // (three short columns fit a phone)
  const W0 = SS[0].winters, red0 = sum(W0, 'red'), dd0 = SS[0].days, R = L.sc_cmp_rows;
  const tc = $('tsc-cmp'); tc.replaceChildren();
  { const hd = el('tr'); for (const h of ['', L.sc_base, ...SS.map(x => L.sc_names[x.id])]) hd.append(el('th', {}, h));
    const th = el('thead'); th.append(hd); tc.append(th); }
  const cb = el('tbody');
  const group = t => { const tr = el('tr'); tr.append(el('th', { colspan: String(SS.length + 2) }, t)); cb.append(tr); };
  const row = (label, vals, best) => { const tr = el('tr'); tr.append(el('td', {}, label)); vals.forEach(v => tr.append(el('td', best ? { class: 'best' } : {}, v))); cb.append(tr); };
  group(L.sc_cmp_groups[0]);
  for (const k of ['heating', 'dust', 'transport', 'heavy']) row(R[k], ['—', ...SS.map(x => '−' + x.cut[k] + '%')]);
  group(L.sc_cmp_groups[1]);
  row(R.pm, ['—', ...SS.map(x => pct(-x.win_pm_cut))], true);
  row(R.aqi, [String(wmean(W0, 'aqi')), ...SS.map(x => String(wmean(x.winters, 'aqi_s')))], true);
  row(R.red, [String(red0), ...SS.map(x => `${sum(x.winters, 'red_s')} (${pct(100 * (sum(x.winters, 'red_s') / red0 - 1))})`)], true);
  row(R.next, [String(dmean(dd0, 'aqi')), ...SS.map(x => String(dmean(x.days, 'aqi_s')))], true);
  tc.append(cb);
  const dd = s => dm(new Date(s + 'T00:00'));
  $('sc-cmp-note').textContent = L.sc_cmp_note(W0.length, W0[0].winter, W0[W0.length - 1].winter, sum(W0, 'days'), dd(dd0[0].date), dd(dd0[dd0.length - 1].date));

  // details for the chosen scenario
  if (!SS.some(x => x.id === SCEN)) SCEN = SS[0].id;
  const X = SS.find(x => x.id === SCEN), name = L.sc_names[SCEN];
  $('sc-pick').setAttribute('aria-label', L.sc_pick_aria);
  for (const b of $('sc-pick').querySelectorAll('button')) {
    b.textContent = L.sc_names[b.dataset.sc];
    b.setAttribute('aria-pressed', String(b.dataset.sc === SCEN));
    b.onclick = () => { SCEN = b.dataset.sc; renderScenario(); };
  }
  $('sc-days-eb').textContent = L.sc_days_eyebrow(name);
  $('sc-months-eb').textContent = L.sc_months_eyebrow(name);
  $('sc-winters-eb').textContent = L.sc_winters_eyebrow(name);
  table('tsc-days', L.sc_days_cols, X.days.map(r => {
    const d = new Date(r.date + 'T00:00');
    return [`${L.wd[d.getDay()]}, ${dm(d)}`, to(r.aqi, r.aqi_s), signed(r.aqi_s - r.aqi), to(Math.round(r.pm), Math.round(r.pm_s)), pct(-r.cut)];
  }));
  const M = Object.fromEntries(X.months.map(m => [m.m, m]));
  // the report's shares belong to the 15th of each month; name the two mid-months around the first day shown
  const d0 = new Date(X.days[0].date + 'T00:00'), m0 = d0.getDate() >= 15 ? d0.getMonth() + 1 : (d0.getMonth() + 11) % 12 + 1, m1 = m0 % 12 + 1;
  const range = (k, f) => { const v = X.days.map(r => r[k]); const lo = f(Math.min(...v)), hi = f(Math.max(...v)); return lo === hi ? lo : `${lo}–${hi}`; };
  $('sc-why').textContent = L.sc_why(L.mon_gen[m0 - 1], M[m0].shares[0], Math.round(M[m0].cut), L.mon_gen[m1 - 1], M[m1].shares[0], Math.round(M[m1].cut),
    range('heat', String), range('cut', v => String(Math.round(v))));
  $('sc-months-note').textContent = L.sc_months_note(S.hist_from.slice(0, 4), S.hist_to.slice(0, 4));
  table('tsc-months', L.sc_month_cols, X.months.map(m => [L.mon[m.m - 1], ...m.shares.slice(0, 4).map(v => v + '%'), pct(-m.cut),
    m.days ? to(m.aqi, m.aqi_s) : '—', m.days ? to(m.red.toFixed(1), m.red_s.toFixed(1)) : '—']));
  const W = X.winters, days = sum(W, 'days');
  const body = table('tsc-winters', L.sc_winter_cols, W.map(w => [w.winter, String(w.days), to(w.aqi, w.aqi_s), to(w.red, w.red_s), to(w.over100, w.over100_s)]));
  if (W.length) {
    const tr = el('tr');
    [L.sc_total, String(days), to(wmean(W, 'aqi'), wmean(W, 'aqi_s')), to(sum(W, 'red'), sum(W, 'red_s')), to(sum(W, 'over100'), sum(W, 'over100_s'))]
      .forEach((v, i) => tr.append(el('td', i ? { class: 'best' } : { class: 'best', style: 'font-family:var(--f-body)' }, v)));
    body.append(tr);
  }
  $('sc-caveats').replaceChildren(...L.sc_caveats.map(t => el('li', {}, t)));
}

// ================================================================ satellites (aqf.satellite): NO2 and fires next to the fact
function renderSat() {
  const S = D.sat || {}, DY = S.days || [], ok = DY.length > 0;
  for (const id of ['sat-chart-card', 'sat-corr-card', 'sat-years-card']) $(id).hidden = !ok;
  $('sat-empty').hidden = ok;
  if (!ok) return;
  const day = s => new Date(s + 'T00:00');
  // three panels on one time axis: the fact as a line, NO2 as dots (clouds leave gaps), fires as bars
  const P = [['aqi', L.sat_panel[0], 'var(--ink)'], ['no2', L.sat_panel[1], 'var(--s1)'], ['fires', L.sat_panel[2], 'var(--s2)']];
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); return Math.ceil(v / p) * p; };
  const host = $('csat'), lg = $('sat-legend');
  const draw = () => {
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth), n = DY.length, m = { l: 40, r: 12 }, gap = 30;
    const PH = W < 500 ? [100, 80, 60] : [120, 95, 70];
    const Hh = PH.reduce((a, b) => a + b, 0) + gap * 3 + 22;
    const x = i => m.l + (n === 1 ? 0.5 : i / (n - 1)) * (W - m.l - m.r);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${Hh}`, role: 'img', 'aria-label': L.sat_aria });
    const tipRows = r => {
      const d = day(r.date);
      return [el('div', { class: 'v' }, `${L.wd[d.getDay()]}, ${dm(d)}`),
        ...P.map(([k, , col]) => tipRow(col, `${L.sat_tip[k]}: ${r[k] == null ? L.sat_tip.none : r[k]}`))];
    };
    const dots = [];
    let top = gap;
    P.forEach(([k, title, col], pi) => {
      const h = PH[pi], vals = DY.map(r => r[k]).filter(v => v != null);
      const yMax = nice(vals.length ? Math.max(...vals) : 1), y = v => top + h - v / yMax * h;
      const t = sv('text', { x: m.l, y: top - 10, class: 'lbl' }); t.textContent = title; svg.append(t);
      for (const v of [0, yMax / 2, yMax]) {
        svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
        const l = sv('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }); l.textContent = Math.round(v); svg.append(l);
      }
      if (k === 'fires') {
        const bw = Math.max(1, (W - m.l - m.r) / n * 0.7);
        DY.forEach((r, i) => { if (r[k] != null && r[k] > 0) svg.append(sv('rect', { x: x(i) - bw / 2, y: y(r[k]), width: bw, height: y(0) - y(r[k]), fill: col })); });
      } else {
        if (k === 'aqi') {
          const d = DY.map((r, i) => r[k] == null ? null : `${i && DY[i - 1][k] != null ? 'L' : 'M'}${x(i)},${y(r[k])}`).filter(Boolean).join(' ');
          if (d) svg.append(sv('path', { d, fill: 'none', stroke: col, 'stroke-width': 1.75, 'stroke-linejoin': 'round' }));
        }
        DY.forEach((r, i) => { if (r[k] != null) svg.append(sv('circle', { cx: x(i), cy: y(r[k]), r: k === 'aqi' ? 2 : 2.75, fill: col })); });
      }
      DY.forEach((r, i) => { if (r[k] != null) dots.push({ x: x(i), y: y(r[k]), col, rows: () => tipRows(r) }); });
      top += h + gap;
    });
    const every = Math.ceil(n / (W < 500 ? 4 : 8));
    DY.forEach((r, i) => { if (i % every === 0) { const d = day(r.date); const t = sv('text', { x: x(i), y: Hh - 6, 'text-anchor': 'middle' }); t.textContent = d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0'); svg.append(t); } });
    host.append(svg);
    dotTip(host, svg, { W, H: Hh, dots });
  };
  draw(); watch(host, draw);
  lg.replaceChildren();
  P.forEach(([, , col], i) => { const sp = el('span'); const k = el('i', { class: 'key-line' }); k.style.background = col; sp.append(k, document.createTextNode(L.sat_legend[i])); lg.append(sp); });
  const G = S.fire_gap, full = s => (L.html.startsWith('zh') ? `${s.slice(0, 4)}年${dm(day(s))}` : `${dm(day(s))} ${s.slice(0, 4)}`);
  $('sat-chart-note').textContent = L.sat_chart_note(S.no2_days, (S.no2_from || '').slice(0, 4)) + (G ? ' ' + L.sat_fire_gap(full(G.from), full(G.to), full(G.daily_from)) : '');
  // correlations with the fact
  const tb = $('tsat-corr'); tb.replaceChildren();
  const hd = el('tr'); for (const h of L.sat_corr_cols) hd.append(el('th', {}, h));
  const th = el('thead'); th.append(hd);
  const body = el('tbody');
  for (const [k, row] of Object.entries(S.corr || {})) {
    const tr = el('tr'); tr.append(el('td', { style: 'font-family:var(--f-body)' }, L.sat_corr_rows[k] || k));
    for (const s of ['all', 'winter', 'autumn', 'last90']) { const c = row[s]; tr.append(el('td', {}, c ? `${c.r.toFixed(2)} (${c.n})` : '—')); }
    body.append(tr);
  }
  tb.append(th, body);
  // the last 30 days against the same days of earlier years
  const Y = S.years || [], ty = $('tsat-years'); ty.replaceChildren();
  $('sat-years-card').hidden = !Y.length;
  if (Y.length) {
    $('sat-years-note').textContent = L.sat_years_note(dm(day(Y[0].to)));
    const h2 = el('tr'); for (const h of L.sat_years_cols) h2.append(el('th', {}, h));
    const t2 = el('thead'); t2.append(h2);
    const b2 = el('tbody');
    Y.forEach((r, i) => {
      const tr = el('tr');
      [String(r.year), r.no2 == null ? '—' : r.no2.toFixed(0), String(r.no2_days), r.fires == null ? '—' : String(r.fires), r.aqi == null ? '—' : String(r.aqi)]
        .forEach((v, j) => tr.append(el('td', i === 0 ? { class: 'best', ...(j ? {} : { style: 'font-family:var(--f-body)' }) } : (j ? {} : { style: 'font-family:var(--f-body)' }), v)));
      b2.append(tr);
    });
    ty.append(t2, b2);
  }
}

// ================================================================ error breakdown (bottom of the forecast-vs-fact tab)
function renderAttr() {
  const A = D.attr || {}, bt = A.backtest || {}, rows = A.live || [];
  $('attr').hidden = !Object.keys(bt).length && !rows.length;
  const KEYS = ['weather', 'pollution', 'unknown'], COLS = ['var(--s1)', 'var(--s2)', 'var(--ink-3)'];
  const leadName = k => (k === 1 ? L.lead1 : k === 3 ? L.lead3 : String(k));
  const mon = s => new Date(s + 'T00:00').toLocaleDateString(L.locale, { month: 'short', year: 'numeric' });
  const first = bt['1'] || bt['3'];
  $('attr-bt-note').textContent = first ? L.attr_bt(first.days, mon(first.from), mon(first.to)) + ' ' + L.attr_cancel : '';
  const bars = $('attr-bars'); bars.replaceChildren();
  for (const k of ['1', '3']) {
    const b = bt[k]; if (!b) continue;
    const sum = KEYS.reduce((a, key) => a + b[key], 0), part = i => `${L.attr_parts[i]} ±${Math.round(b[KEYS[i]])} (${pct(b[KEYS[i]] / sum)})`;
    const bar = el('div', { class: 'attr-bar', role: 'img', 'aria-label': KEYS.map((_, i) => part(i)).join(', ') });
    KEYS.forEach((key, i) => { const s = el('i', { title: part(i) }); s.style.width = (100 * b[key] / sum) + '%'; s.style.background = COLS[i]; bar.append(s); });
    const row = el('div', { class: 'attr-row' });
    row.append(el('span', {}, leadName(+k)), bar, el('b', {}, `${L.attr_total} ±${Math.round(b.error)}`),
      el('span', { class: 'cap' }, KEYS.map((_, i) => part(i)).join(' · ')));
    bars.append(row);
  }
  const lg = $('attr-legend'); lg.replaceChildren();
  KEYS.forEach((_, i) => { const sp = el('span'); const k = el('i', { class: 'key-band' }); k.style.background = COLS[i]; sp.append(k, document.createTextNode(L.attr_parts[i])); lg.append(sp); });
  // days in real use, newest first; whole numbers that add up to the row's error. The re-run
  // column (issued forecast − its re-run) shows only while some row has one
  const tb = $('tattr'); tb.replaceChildren(); tb.hidden = !rows.length;
  const showRerun = rows.some(r => !r.weather_saved || r.same_model === false || Math.round(r.rerun || 0) !== 0);
  const showNN = rows.some(r => Math.round(r.network || 0) !== 0);  // the blend's shift (model version 2026-11-04)
  $('attr-live-note').textContent = !rows.length ? L.attr_live_empty
    : L.attr_live_note + (showNN ? ' ' + L.attr_nn : '') + (showRerun ? ' ' + L.attr_rerun : '');
  if (!rows.length) return;
  const hd = el('tr');
  for (const h of [...L.attr_cols, ...(showNN ? [L.attr_col_nn] : []), ...(showRerun ? [L.attr_col_rerun] : [])]) hd.append(el('th', {}, h));
  const th = el('thead'); th.append(hd); tb.append(th);
  const body = el('tbody');
  for (const r of [...rows].reverse().slice(0, 60)) {
    const d = new Date(r.date + 'T00:00'), err = r.forecast - r.actual;
    const w = Math.round(r.weather), p = Math.round(r.pollution), g = showRerun ? Math.round(r.rerun || 0) : 0;
    const n = showNN ? Math.round(r.network || 0) : 0;
    const tr = el('tr');
    tr.append(el('td', { style: 'font-family:var(--f-body)' }, `${L.wd[d.getDay()]}, ${dm(d)}`),
      el('td', {}, `${r.forecast} · ${leadName(r.lead)}`), el('td', { class: 'best' }, String(r.actual)), el('td', {}, signed(err)),
      el('td', {}, (r.weather_saved ? '' : '≈') + signed(w)), el('td', {}, signed(p)), el('td', {}, signed(err - w - p - g - n)));
    if (showNN) tr.append(el('td', {}, signed(n)));
    if (showRerun) tr.append(el('td', {}, signed(g) + (r.same_model === false ? '*' : '')));
    body.append(tr);
  }
  tb.append(body);
}

// ================================================================ backtest
let SCOPE = 'iqair';
function renderTrust() {
  const B = D.bt;
  $('trust-note').textContent = L.trust(B.n_forecasts.toLocaleString(L.locale), Math.round(B.d24.model), Math.round(B.d24.persist), Math.round(B.d7.model), Math.round(B.d7.clim));
  const maeHost = $('cmae'), tm = $('tmae');
  const maeChart = rows => {
    maeHost.replaceChildren();
    const W = Math.max(280, maeHost.clientWidth), H = W < 500 ? 242 : 260;
    // on a phone the horizon labels would overlap: every other one goes a line lower
    const narrow = (W - 138) / Math.max(1, rows.length - 1) < 46;
    const m = { l: 34, r: 104, t: 12, b: narrow ? 46 : 34 };
    const keys = [['model', 'var(--s1)', L.s_model], ['persist', 'var(--s2)', L.s_persist], ['clim', 'var(--s3)', L.s_clim]];
    const yMax = Math.ceil(Math.max(...rows.flatMap(r => keys.map(k => r[k[0]]))) / 10) * 10;
    const x = i => m.l + (rows.length === 1 ? 0 : i / (rows.length - 1)) * (W - m.l - m.r);
    const y = v => H - m.b - v / yMax * (H - m.t - m.b);
    const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': L.mae_aria });
    for (let v = 0; v <= yMax; v += 10) {
      s.append(sv('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
      const t = sv('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = v; s.append(t);
    }
    rows.forEach((r, i) => { const t = sv('text', { x: x(i), y: H - m.b + 16 + (narrow && i % 2 ? 12 : 0), 'text-anchor': 'middle' }); t.textContent = r.b; s.append(t); });
    const ax = sv('text', { x: m.l + (W - m.l - m.r) / 2, y: H - 2, 'text-anchor': 'middle' }); ax.textContent = L.axis_h; s.append(ax);
    const ends = [];
    for (const [k, col, name] of keys) {
      s.append(sv('path', { d: 'M' + rows.map((r, i) => `${x(i)},${y(r[k])}`).join(' L'), fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round' }));
      rows.forEach((r, i) => s.append(sv('circle', { cx: x(i), cy: y(r[k]), r: 4, fill: col, stroke: 'var(--surface)', 'stroke-width': 2 })));
      ends.push({ y: y(rows[rows.length - 1][k]), name });
    }
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    for (const e of ends) { const t = sv('text', { x: W - m.r + 8, y: e.y + 4, class: 'lbl' }); t.textContent = e.name; s.append(t); }
    maeHost.append(s);
    dotTip(maeHost, s, {
      W, H, dots: keys.flatMap(([k, col, name]) => rows.map((r, i) => ({
        x: x(i), y: y(r[k]), col,
        rows: () => [el('div', { class: 'v' }, `±${r[k].toFixed(1)} AQI`), tipRow(col, name), el('div', { class: 'r' }, `${L.axis_h}: ${r.b}`)],
      }))),
    });
  };
  const maeTable = rows => {
    tm.replaceChildren();
    const hd = el('tr'); for (const h of L.mae_cols) hd.append(el('th', {}, h));
    const thead = el('thead'); thead.append(hd); tm.append(thead);
    const tb = el('tbody');
    for (const r of rows) {
      const tr = el('tr'); const base = Math.min(r.persist, r.clim);
      tr.append(el('td', {}, r.b), el('td', { class: 'best' }, r.model.toFixed(1)), el('td', {}, r.persist.toFixed(1)), el('td', {}, r.clim.toFixed(1)),
        el('td', { class: 'gain' }, '−' + Math.round((1 - r.model / base) * 100) + '%'), el('td', {}, Math.round(r.cat * 100) + '%'));
      tb.append(tr);
    }
    tm.append(tb);
  };
  const setScope = sc => {
    SCOPE = sc;
    for (const b of document.querySelectorAll('#scope button')) b.setAttribute('aria-pressed', String(b.dataset.scope === sc));
    maeChart(B.hourly[sc]); maeTable(B.hourly[sc]);
  };
  for (const b of document.querySelectorAll('#scope button')) b.onclick = () => setScope(b.dataset.scope);
  setScope(SCOPE);
  watch(maeHost, () => maeChart(B.hourly[SCOPE]));
  const cap = text => el('caption', { style: 'text-align:left; padding-bottom:8px; font-weight:600; font-size:14px' }, text);
  const td = $('tdaily'); td.replaceChildren(cap(L.daily_cap));
  { const hd = el('tr'); for (const h of L.daily_cols) hd.append(el('th', {}, h)); const th = el('thead'); th.append(hd); td.append(th); }
  { const tb = el('tbody');
    for (const r of B.daily) {
      const tr = el('tr'); const g = Math.round((1 - r.model / Math.min(r.persist, r.clim)) * 100);
      tr.append(el('td', {}, r.b), el('td', { class: 'best' }, r.model.toFixed(1)), el('td', {}, r.persist.toFixed(1)), el('td', {}, r.clim.toFixed(1)), el('td', { class: g > 0 ? 'gain' : '' }, (g > 0 ? '−' : g < 0 ? '+' : '') + Math.abs(g) + '%'));
      tb.append(tr);
    }
    td.append(tb); }
  const ts = $('tseason'); ts.replaceChildren(cap(L.seas_cap));
  { const hd = el('tr'); for (const h of L.seas_cols) hd.append(el('th', {}, h)); const th = el('thead'); th.append(hd); ts.append(th); }
  { const tb = el('tbody');
    for (const r of B.seasons) {
      const tr = el('tr');
      const nm = `${r.y}/${String((r.y + 1) % 100).padStart(2, '0')}` + (r.partial ? ` (${L.so_far})` : '');
      tr.append(el('td', {}, nm), el('td', { style: 'font-family:var(--f-body); text-align:left' }, L.src[r.src_code] || r.src), el('td', {}, String(r.n)),
        el('td', { class: 'best' }, r.h24.toFixed(1)), el('td', {}, r.h24p.toFixed(1)), el('td', { class: 'best' }, r.d37.toFixed(1)), el('td', {}, r.d37c.toFixed(1)));
      tb.append(tr);
    }
    ts.append(tb); }
}

// ================================================================ live latest reading
// On the Vercel site the page can call its own /api/latest (5-minute server cache; the
// button asks for a fresh value). Inside claude.ai such requests are blocked, so the
// button stays hidden and the reading from the last forecast run is shown.
let LIVE = null;
function applyLive() {
  if (!LIVE) return;
  $('mini-num').textContent = Math.round(LIVE.aqi);
  $('mini-chip').textContent = label(LIVE.aqi); $('mini-chip').style.background = fill(LIVE.aqi);
  const iso = LIVE.recorded_at || '';
  const d = new Date(iso.slice(0, 10) + 'T00:00:00');
  const mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
  $('live-stamp').textContent = L.live_reading(iso.slice(11, 16), dm(d), mins >= 0 && mins < 24 * 60 ? L.ago_min(mins) : '');
  $('refresh').textContent = L.refresh;
  $('refresh').hidden = false;
  $('live-row').hidden = false;
}
async function refreshLatest(manual) {
  const btn = $('refresh');
  if (manual) { btn.disabled = true; btn.textContent = L.refreshing; }
  try {
    // the refresh button gets a value at most 30 s old from the edge cache (no cache-busting URL)
    const r = await fetch('api/latest' + (manual ? '?fresh=1' : ''), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (typeof j.aqi !== 'number' || !j.recorded_at) throw new Error('bad payload');
    LIVE = j;
    applyLive();
  } catch (e) {
    if (manual) $('live-stamp').textContent = L.refresh_failed;
  } finally {
    btn.disabled = false;
    if (LIVE) btn.textContent = L.refresh;
  }
}
$('refresh').addEventListener('click', () => refreshLatest(true));
if (location.protocol.startsWith('http')) refreshLatest(false);

// ================================================================ tabs + language switch (wired once)
// sections by importance: the forecast, then history (what was, and how forecasts came true),
// then research; the URL hash names the tab, the section follows from it
const SECTIONS = { fc: ['day', 'week', 'season'], past: ['history', 'live'], lab: ['accuracy', 'compare', 'scenario', 'sat', 'about'] };
const TABS = Object.values(SECTIONS).flat();
const secOf = t => Object.keys(SECTIONS).find(s => SECTIONS[s].includes(t));
const lastTab = {};
let CUR = 'day';
// a phone may not fit every tab of a section: bring the chosen one into view, fade the cut edge
// (again after a language switch or late fonts, which change the widths)
const reveal = () => {
  const row = $('sub-' + secOf(CUR)), b = $('tab-' + CUR);
  if (b.offsetLeft + b.offsetWidth > row.scrollLeft + row.clientWidth || b.offsetLeft < row.scrollLeft) row.scrollLeft = b.offsetLeft - 24;
  edge(row);
};
const showTab = (t, focus) => {
  const s = secOf(t);
  lastTab[s] = t;
  for (const k of Object.keys(SECTIONS)) $('sub-' + k).hidden = k !== s;
  for (const b of document.querySelectorAll('#sections button')) b.setAttribute('aria-current', b.dataset.sec === s ? 'page' : 'false');
  for (const k of TABS) {
    const on = k === t;
    $('p-' + k).hidden = !on;
    $('tab-' + k).setAttribute('aria-selected', String(on));
    $('tab-' + k).tabIndex = on ? 0 : -1;
  }
  CUR = t;
  reveal();
  if (focus) $('tab-' + t).focus();
  try { localStorage.setItem('aqf-tab', t); } catch (e) {}
  try { if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t); } catch (e) {}
};
const edge = row => {
  const l = row.scrollLeft > 2, r = row.scrollLeft + row.clientWidth < row.scrollWidth - 2;
  row.setAttribute('data-more', l && r ? 'both' : l ? 'left' : r ? 'right' : 'none');
};
for (const s of Object.keys(SECTIONS)) $('sub-' + s).addEventListener('scroll', e => edge(e.currentTarget), { passive: true });
window.addEventListener('resize', () => { for (const s of Object.keys(SECTIONS)) edge($('sub-' + s)); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(reveal);
const arrow = e => (e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0);
for (const [s, list] of Object.entries(SECTIONS)) list.forEach((t, i) => {
  const b = $('tab-' + t);
  b.addEventListener('click', () => showTab(t));
  b.addEventListener('keydown', e => {
    const d = arrow(e);
    if (d) { showTab(list[(i + d + list.length) % list.length], true); e.preventDefault(); }
  });
});
const secBtns = [...document.querySelectorAll('#sections button')];
secBtns.forEach((b, i) => {
  const open = s => showTab(lastTab[s] || SECTIONS[s][0]);
  b.addEventListener('click', () => open(b.dataset.sec));
  b.addEventListener('keydown', e => {
    const d = arrow(e);
    if (d) { const n = secBtns[(i + d + secBtns.length) % secBtns.length]; open(n.dataset.sec); n.focus(); e.preventDefault(); }
  });
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t)) showTab(t); });
for (const b of document.querySelectorAll('#langs button')) b.addEventListener('click', () => {
  LANG = b.dataset.lang; L = I18N[LANG];
  try { localStorage.setItem('aqf-lang', LANG); } catch (e) {}
  render();
  reveal();
});
render();
let first = location.hash.slice(1);
if (!TABS.includes(first)) { try { first = localStorage.getItem('aqf-tab'); } catch (e) { first = null; } }
showTab(TABS.includes(first) ? first : 'day');
})();
</script>
